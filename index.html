/* ================= lab page ================= */
function renderLab(id, role) {
  const lab = LABS[id - 1];
  const app = $('#app');
  app.innerHTML = `
    <h2 class="lab-title">מעבדה ${lab.id}: ${fmt(lab.title)}</h2>
    <p class="lab-sub">${lab.area}</p>
    <div class="role-tabs" role="tablist" aria-label="סוג ההנחיות">
      ${ROLES.map(r => `<button role="tab" aria-selected="${r.key === role}" data-role="${r.key}">${r.label}</button>`).join('')}
    </div>
    <section class="panel" role="tabpanel" id="panel"></section>`;
  app.querySelectorAll('.role-tabs button').forEach(b => b.addEventListener('click', () => go(`#lab-${id}/${b.dataset.role}`)));

  const panel = $('#panel');
  panel.appendChild($(`#lab${id}-${role}`).content.cloneNode(true));
  // shared background sections (e.g. enzymes for labs 3-6)
  panel.querySelectorAll('[data-include]').forEach(d => d.replaceWith($('#' + d.dataset.include).content.cloneNode(true)));
  if (role === 'student') {
    const sim = document.createElement('div');
    panel.appendChild(sim);
    (id === 1 ? Lab1Sim : SIMS[id]).mount(sim);
  }
  window.scrollTo(0, 0);
}

/* ================= charts ================= */
function chart({ points, xLabel, yLabel, xMin, xMax, yMax, line, highlight, xTicks, yTicks }) {
  const W = 440, H = 260, L = 52, R = 14, T = 14, B = 46;
  const sx = x => L + (x - xMin) / (xMax - xMin) * (W - L - R);
  const sy = y => H - B - (y / yMax) * (H - T - B);
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)} כתלות ב${esc(xLabel)}" direction="ltr">`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="#fff" stroke="#d9dee7"/>`;
  yTicks.forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/>`;
    g += `<text x="${L - 6}" y="${sy(v) + 4}" font-size="11" text-anchor="end" fill="#5b6475">${v}</text>`;
  });
  xTicks.forEach(v => g += `<text x="${sx(v)}" y="${H - B + 16}" font-size="11" text-anchor="middle" fill="#5b6475">${v}</text>`);
  g += `<text x="${(L + W - R) / 2}" y="${H - 8}" font-size="12" text-anchor="middle" fill="#1d2330">${esc(xLabel)}</text>`;
  g += `<text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" font-size="12" text-anchor="middle" fill="#1d2330">${esc(yLabel)}</text>`;
  if (line) {
    g += `<line x1="${sx(xMin)}" y1="${sy(Math.max(0, line.a * xMin + line.b))}" x2="${sx(xMax)}" y2="${sy(line.a * xMax + line.b)}" stroke="#0f6e6e" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  } else if (points.length > 1) {
    g += `<polyline fill="none" stroke="#b0247a" stroke-width="2" points="${points.map(p => sx(p[0]) + ',' + sy(p[1])).join(' ')}"/>`;
  }
  points.forEach(p => g += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4.5" fill="#b0247a"/>`);
  if (highlight) g += `<circle cx="${sx(highlight[0])}" cy="${sy(highlight[1])}" r="7" fill="none" stroke="#f4b400" stroke-width="3"/>`;
  return g + '</svg>';
}

function linreg(pts) {
  const n = pts.length;
  const mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  pts.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; });
  const a = sxy / sxx, b = my - a * mx;
  return { a, b, r2: (sxy * sxy) / (sxx * syy) };
}

/* ================= Lab 1 simulation ================= */
const Lab1Sim = (() => {
  const STOCK = 0.15;                                   // mg/ml
  const WL = [500, 520, 540, 560, 580, 600];
  const SPECTRUM = { 500: 0.21, 520: 0.36, 540: 0.33, 560: 0.27, 580: 0.10, 600: 0.04 };
  const BEST = 520;
  const V1 = [0.5, 1.0, 1.5, 2.0, 2.5];
  const CAL_A = [0.37, 0.71, 1.09, 1.43, 1.81];          // measured at 520nm
  const UNKNOWN_A = 0.95;
  const STAGES = ['הכנת מיהול', 'ספקטרום בליעה', 'סדרת מיהול', 'גרף כיול', 'ריכוז נעלם', 'סיכום'];

  let el, s;
  const fresh = () => ({
    step: 0,
    // step 0: dilution
    pick: null, filled: false, mixed: false, cuvette: false,
    // step 1: spectrum
    wl: 500, zeroedAt: null, inCell: null, reading: null, spec: {}, bestPick: null,
    // step 2: series
    water: ['', '', '', '', ''], conc: ['', '', '', '', ''], seriesChecked: false, seriesOk: false,
    // step 3: calibration
    calZero: false, calWl: null, cal: [null, null, null, null, null],
    // step 4: unknown
    unkRead: false, unkAns: '', unkOk: false,
    // step 5: quiz
    quiz: {},
    msg: null,
  });

  function mount(container) { el = container; s = fresh(); draw(); }
  function say(type, text) { s.msg = { type, text }; }
  function next() { s.step++; s.msg = null; s.reading = null; s.inCell = null; draw(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  /* ---------- visuals ---------- */
  function tubeColor(c) {                               // c in mg/ml (0..0.15)
    if (!c) return 'rgba(210,230,245,.55)';
    const k = Math.min(1, c / 0.04);
    return `rgba(176,36,122,${0.12 + 0.8 * k})`;
  }
  function spectroSVG(display, cellColor, label) {
    return `<svg viewBox="0 0 420 260" aria-hidden="true">
      <rect x="40" y="70" width="340" height="150" rx="16" fill="#cfd6e0" stroke="#9aa5b5"/>
      <rect x="40" y="70" width="340" height="40" rx="16" fill="#b7c1cf"/>
      <rect x="70" y="128" width="150" height="60" rx="6" fill="#16323a"/>
      <text x="145" y="152" font-size="13" fill="#7ee3c3" text-anchor="middle" font-family="Consolas, monospace">λ = ${s.step >= 3 ? (s.calWl || s.wl) : s.wl} nm</text>
      <text x="145" y="176" font-size="18" fill="#7ee3c3" text-anchor="middle" font-family="Consolas, monospace">${display}</text>
      <rect x="260" y="40" width="70" height="80" rx="6" fill="#8f9bad"/>
      <rect x="282" y="20" width="26" height="70" rx="3" fill="#fff" stroke="#6b7280"/>
      <rect x="284" y="${cellColor ? 38 : 88}" width="22" height="${cellColor ? 50 : 0}" fill="${cellColor || 'transparent'}"/>
      <text x="295" y="14" font-size="12" text-anchor="middle" fill="#1d2330">${label || ''}</text>
      <text x="210" y="245" font-size="13" text-anchor="middle" fill="#5b6475">ספקטרופוטומטר</text>
    </svg>`;
  }
  function tubesSVG(list) {                              // list of {c, label, vol}
    const w = 420, gap = w / (list.length + 1);
    let g = `<svg viewBox="0 0 ${w} 240" aria-hidden="true"><rect x="20" y="170" width="${w - 40}" height="14" rx="4" fill="#cfd6e0"/>`;
    list.forEach((t, i) => {
      const x = gap * (i + 1);
      const h = Math.max(0, Math.min(1, t.vol / 10)) * 120;
      g += `<rect x="${x - 15}" y="40" width="30" height="140" rx="14" fill="#fff" stroke="#6b7280"/>`;
      if (h) g += `<rect x="${x - 13}" y="${178 - h}" width="26" height="${h}" rx="11" fill="${tubeColor(t.c)}"/>`;
      g += `<text x="${x}" y="210" font-size="13" text-anchor="middle" fill="#1d2330">${esc(t.label)}</text>`;
    });
    return g + '</svg>';
  }

  /* ---------- steps ---------- */
  function stepDilution() {
    const vol = s.pick ? (s.filled ? 10 : s.pick) : 0;
    const visual = tubesSVG([{ c: STOCK, label: 'תמיסת אם', vol: 8 }, { c: s.filled ? STOCK * s.pick / 10 : (s.pick ? STOCK : 0), label: 'מבחנה', vol }]);
    let ctrl = `<h3>שלב 1: הכנת תמיסה מהולה</h3>
      <p>לפניכם תמיסת אם של <span class="ltr">KMnO₄</span> בריכוז 0.15 מ"ג/מ"ל. היא מרוכזת מדי למדידה, ולכן מוהלים אותה.</p>`;
    if (!s.pick) {
      ctrl += `<p><b>כמה מ"ל מתמיסת האם תעבירו למבחנה?</b></p>
        <div class="btn-row">${[0.1, 0.5, 2, 5].map(v => `<button class="btn" data-act="pick" data-v="${v}">${v} מ"ל</button>`).join('')}</div>`;
    } else if (!s.filled) {
      ctrl += `<p>העברתם 0.5 מ"ל. עכשיו משלימים במים מזוקקים.</p>
        <div class="btn-row"><button class="btn primary" data-act="fill">השלם במים מזוקקים ל-10 מ"ל</button></div>`;
    } else if (!s.mixed) {
      ctrl += `<p>יש 10 מ"ל תמיסה במבחנה. מה עושים לפני שמעבירים לקיווטה?</p>
        <div class="btn-row">
          <button class="btn" data-act="mix" data-v="0">מעבירים מיד לקיווטה</button>
          <button class="btn" data-act="mix" data-v="1">סוגרים בפקק ומערבבים בהיפוך המבחנה</button>
        </div>`;
    } else if (!s.cuvette) {
      ctrl += `<p><b>כמה מ"ל מהתמיסה המהולה מעבירים לקיווטה?</b></p>
        <div class="btn-row">${[1, 3, 10].map(v => `<button class="btn" data-act="cuv" data-v="${v}">${v} מ"ל</button>`).join('')}</div>`;
    } else {
      ctrl += `<div class="btn-row"><button class="btn primary" data-act="next">לשלב הבא: מדידת ספקטרום ←</button></div>`;
    }
    ctrl += `<div class="why"><b>למה?</b> אם התמיסה מרוכזת מדי, היא בולעת כמעט את כל האור והמכשיר לא מודד בדיוק. במיהול מקבלים ריכוז של <span class="formula">0.15 × 0.5 / 10 = 0.0075</span> מ"ג/מ"ל.</div>`;
    return { visual, ctrl };
  }

  function stepSpectrum() {
    const cellColor = s.inCell === 'blank' ? tubeColor(0) : s.inCell === 'sample' ? tubeColor(0.0075) : null;
    const display = s.reading === null ? (s.zeroedAt === s.wl ? '0.000' : '---') : s.reading.toFixed(3);
    const visual = spectroSVG(display, cellColor, s.inCell === 'blank' ? 'בלנק' : s.inCell === 'sample' ? 'דוגמה' : '');
    const done = WL.filter(w => s.spec[w] !== undefined);
    let ctrl = `<h3>שלב 2: מדידת ספקטרום בליעה</h3>
      <p>מדדו את הבליעה של התמיסה המהולה בכל אורכי הגל. לכל אורך גל: בוחרים אורך גל, מאפסים עם בלנק, ואז מודדים את הדוגמה.</p>
      <p><b>אורך גל:</b></p>
      <div class="btn-row">${WL.map(w => `<button class="btn ${w === s.wl ? 'sel' : ''}" data-act="wl" data-v="${w}">${w}${s.spec[w] !== undefined ? ' ✓' : ''}</button>`).join('')}</div>
      <div class="btn-row">
        <button class="btn" data-act="zero">הכנס בלנק ואפס</button>
        <button class="btn" data-act="measure">הכנס דוגמה ומדוד</button>
      </div>`;
    ctrl += `<div class="table-wrap"><table><tr><th>אורך גל (nm)</th>${WL.map(w => `<th>${w}</th>`).join('')}</tr>
      <tr><th>בליעה</th>${WL.map(w => `<td>${s.spec[w] !== undefined ? s.spec[w].toFixed(2) : ''}</td>`).join('')}</tr></table></div>`;
    if (done.length) {
      ctrl += chart({ points: done.map(w => [w, s.spec[w]]), xLabel: 'אורך גל (nm)', yLabel: 'בליעה', xMin: 500, xMax: 600, yMax: 0.4,
        xTicks: WL, yTicks: [0, 0.1, 0.2, 0.3, 0.4] });
    }
    if (done.length === WL.length) {
      ctrl += `<p><b>מהו אורך הגל המיטבי לבניית גרף כיול?</b></p>
        <div class="btn-row">${WL.map(w => `<button class="btn ${s.bestPick === w ? 'sel' : ''}" data-act="best" data-v="${w}">${w} nm</button>`).join('')}</div>`;
      if (s.bestPick === BEST) ctrl += `<div class="btn-row"><button class="btn primary" data-act="next">לשלב הבא: סדרת מיהול ←</button></div>`;
    }
    ctrl += `<div class="why"><b>למה מאפסים בכל אורך גל?</b> גם הקיווטה וגם המים בולעים קצת אור, והבליעה שלהם משתנה לפי אורך הגל. האיפוס עם בלנק מבטיח שנמדדת רק הבליעה של <span class="ltr">KMnO₄</span>.</div>`;
    return { visual, ctrl };
  }

  function stepSeries() {
    const visual = tubesSVG(V1.map((v, i) => ({ c: STOCK * v / 10, vol: 10, label: String(i + 1) })));
    let rows = V1.map((v, i) => {
      const wOk = s.seriesChecked ? Math.abs(+s.water[i] - (10 - v)) < 0.001 : null;
      const cOk = s.seriesChecked ? Math.abs(+s.conc[i] - STOCK * v / 10) < 0.0006 : null;
      return `<tr><td>${i + 1}</td><td>${v.toFixed(1)}</td>
        <td class="${wOk === null ? '' : wOk ? 'good' : 'bad'}"><input type="number" step="0.1" data-in="water" data-i="${i}" value="${esc(s.water[i])}" aria-label="נפח מים למבחנה ${i + 1}"></td>
        <td class="${cOk === null ? '' : cOk ? 'good' : 'bad'}"><input type="number" step="0.0001" data-in="conc" data-i="${i}" value="${esc(s.conc[i])}" aria-label="ריכוז במבחנה ${i + 1}"></td></tr>`;
    }).join('');
    let ctrl = `<h3>שלב 3: הכנת סדרת מיהול</h3>
      <p>הנפח הסופי בכל מבחנה הוא 10 מ"ל. השלימו כמה מים מוסיפים לכל מבחנה, וחשבו את הריכוז אחרי המיהול לפי <span class="formula">C1·V1 = C2·V2</span>.</p>
      <div class="table-wrap"><table><tr><th>מבחנה</th><th>תמיסת אם (מ"ל)</th><th>מים (מ"ל)</th><th>ריכוז (מ"ג/מ"ל)</th></tr>${rows}</table></div>
      <div class="btn-row"><button class="btn primary" data-act="checkSeries">בדוק</button><button class="btn" data-act="showSeries">הצג פתרון</button></div>`;
    if (s.seriesOk) ctrl += `<div class="btn-row"><button class="btn primary" data-act="next">לשלב הבא: גרף כיול ←</button></div>`;
    ctrl += `<div class="why"><b>דוגמה למבחנה 1:</b> <span class="formula">C2 = 0.15 × 0.5 / 10 = 0.0075</span> מ"ג/מ"ל, ומוסיפים <span class="formula">10 − 0.5 = 9.5</span> מ"ל מים.</div>`;
    return { visual, ctrl };
  }

  function stepCalibration() {
    const measured = s.cal.map((a, i) => a === null ? null : [STOCK * V1[i] / 10, a]).filter(Boolean);
    const display = s.reading === null ? (s.calZero ? '0.000' : '---') : s.reading.toFixed(3);
    const visual = spectroSVG(display, s.inCell === 'blank' ? tubeColor(0) : s.inCell ? tubeColor(+s.inCell) : null, s.inCell === 'blank' ? 'בלנק' : s.inCell ? 'דוגמה' : '');
    let ctrl = `<h3>שלב 4: בניית גרף כיול</h3>
      <p>כוונו את המכשיר לאורך הגל המיטבי, אפסו עם בלנק, ומדדו את הבליעה של מבחנות 1–5.</p>
      <p><b>אורך גל:</b></p>
      <div class="btn-row">${WL.map(w => `<button class="btn ${w === s.calWl ? 'sel' : ''}" data-act="calWl" data-v="${w}">${w}</button>`).join('')}</div>
      <div class="btn-row"><button class="btn" data-act="calZero">הכנס בלנק ואפס</button></div>
      <div class="btn-row">${V1.map((v, i) => `<button class="btn" data-act="calMeasure" data-v="${i}">מדוד מבחנה ${i + 1}${s.cal[i] !== null ? ' ✓' : ''}</button>`).join('')}</div>`;
    ctrl += `<div class="table-wrap"><table><tr><th>מבחנה</th>${V1.map((v, i) => `<th>${i + 1}</th>`).join('')}</tr>
      <tr><th>ריכוז</th>${V1.map(v => `<td>${(STOCK * v / 10).toFixed(4)}</td>`).join('')}</tr>
      <tr><th>בליעה</th>${s.cal.map(a => `<td>${a === null ? '' : a.toFixed(2)}</td>`).join('')}</tr></table></div>`;
    if (measured.length) {
      const all = measured.length === 5;
      const reg = all ? linreg(measured) : null;
      ctrl += chart({ points: measured, xLabel: 'ריכוז KMnO4 (מ"ג/מ"ל)', yLabel: 'בליעה', xMin: 0, xMax: 0.04, yMax: 2,
        xTicks: [0, 0.01, 0.02, 0.03, 0.04], yTicks: [0, 0.5, 1, 1.5, 2], line: reg });
      if (all) {
        ctrl += `<div class="feedback ok">משוואת הקו: <span class="formula">y = ${reg.a.toFixed(2)}x ${reg.b < 0 ? '−' : '+'} ${Math.abs(reg.b).toFixed(4)}</span> · <span class="formula">R² = ${reg.r2.toFixed(4)}</span><br>הנקודות כמעט על קו ישר: זה חוק בר-למברט.</div>
          <div class="btn-row"><button class="btn primary" data-act="next">לשלב הבא: ריכוז הנעלם ←</button></div>`;
      }
    }
    ctrl += `<div class="why"><b>למה מאפסים רק פעם אחת?</b> בשלב זה עובדים באורך גל אחד בלבד, ולכן מספיק איפוס אחד בתחילת הקריאה.</div>`;
    return { visual, ctrl };
  }

  function stepUnknown() {
    const pts = s.cal.map((a, i) => [STOCK * V1[i] / 10, a]);
    const reg = linreg(pts);
    const ans = (UNKNOWN_A - reg.b) / reg.a;
    const display = s.unkRead ? UNKNOWN_A.toFixed(3) : '0.000';
    const visual = spectroSVG(display, s.unkRead ? tubeColor(ans) : tubeColor(0), s.unkRead ? 'נעלם' : 'בלנק');
    let ctrl = `<h3>שלב 5: מציאת הריכוז ה"נעלם"</h3>
      <p>המכשיר מכוון ל-${BEST}nm ומאופס. מדדו את תמיסת הנעלם.</p>
      <div class="btn-row"><button class="btn primary" data-act="unkRead" ${s.unkRead ? 'disabled' : ''}>הכנס תמיסת נעלם ומדוד</button></div>`;
    if (s.unkRead) {
      ctrl += `<p>ערך הבליעה של הנעלם: <b class="ltr">${UNKNOWN_A.toFixed(2)}</b></p>
        <p>משוואת הקו: <span class="formula">y = ${reg.a.toFixed(2)}x ${reg.b < 0 ? '−' : '+'} ${Math.abs(reg.b).toFixed(4)}</span></p>
        <p><b>מהו ריכוז הנעלם (מ"ג/מ"ל)?</b></p>
        <div class="btn-row"><input type="number" step="0.0001" data-in="unk" value="${esc(s.unkAns)}" aria-label="ריכוז הנעלם"><button class="btn primary" data-act="unkCheck">בדוק</button></div>`;
      ctrl += chart({ points: pts, xLabel: 'ריכוז KMnO4 (מ"ג/מ"ל)', yLabel: 'בליעה', xMin: 0, xMax: 0.04, yMax: 2,
        xTicks: [0, 0.01, 0.02, 0.03, 0.04], yTicks: [0, 0.5, 1, 1.5, 2], line: reg, highlight: s.unkOk ? [ans, UNKNOWN_A] : null });
      if (s.unkOk) ctrl += `<div class="btn-row"><button class="btn primary" data-act="next">לסיכום ←</button></div>`;
    }
    ctrl += `<div class="why"><b>איך מחשבים?</b> מציבים את הבליעה במקום <span class="formula">y</span> ומבודדים את <span class="formula">x</span>: <span class="formula">x = (y − b) / a</span></div>`;
    return { visual, ctrl, ans };
  }

  const QUIZ = [
    { q: 'מדוע מאפסים את הספקטרופוטומטר עם קיווטה של מים מזוקקים?', opts: ['כדי לחמם את המכשיר', 'כדי למדוד רק את הבליעה של החומר, בלי הבליעה של הקיווטה והמים', 'כדי לשטוף את הקיווטה'], a: 1 },
    { q: 'מה מאפיין את אורך הגל המיטבי?', opts: ['הבליעה בו מקסימלית', 'הבליעה בו מינימלית', 'זה תמיד 500nm'], a: 0 },
    { q: 'האם אורך הגל המיטבי של KMnO₄ יתאים לכל חומר?', opts: ['כן, אורך הגל זהה לכל החומרים', 'לא, לכל חומר יש ספקטרום בליעה ייחודי'], a: 1 },
  ];
  function stepSummary() {
    const visual = tubesSVG(V1.map((v, i) => ({ c: STOCK * v / 10, vol: 10, label: String(i + 1) })).concat([{ c: 0.0198, vol: 10, label: '?' }]));
    let ctrl = `<h3>סיכום</h3>
      <ul>
        <li>אורך הגל המיטבי: <b>${BEST}nm</b>, שבו הבליעה מקסימלית.</li>
        <li>גרף הכיול ישר: הבליעה עולה ביחס ישר לריכוז (חוק בר-למברט).</li>
        <li>את ריכוז הנעלם מחשבים בעזרת משוואת הקו.</li>
      </ul><h3>בדקו את עצמכם</h3>`;
    ctrl += QUIZ.map((it, qi) => {
      const pick = s.quiz[qi];
      return `<div class="quiz-q"><p>${qi + 1}. ${fmt(it.q)}</p><div class="btn-row">
        ${it.opts.map((o, oi) => `<button class="btn ${pick === oi ? 'sel' : ''}" data-act="quiz" data-q="${qi}" data-v="${oi}">${o}</button>`).join('')}</div>
        ${pick === undefined ? '' : pick === it.a ? '<div class="feedback ok">נכון!</div>' : '<div class="feedback err">לא מדויק, נסו שוב.</div>'}</div>`;
    }).join('');
    ctrl += `<div class="btn-row"><button class="btn" data-act="restart">התחל מחדש</button></div>`;
    return { visual, ctrl };
  }

  /* ---------- actions ---------- */
  function act(a, v, btn) {
    s.msg = null;
    switch (a) {
      case 'next': return next();
      case 'restart': s = fresh(); break;
      case 'pick':
        if (+v === 0.5) { s.pick = 0.5; say('ok', 'נכון! מעבירים 0.5 מ"ל (500 מיקרוליטר) בפיפטור.'); }
        else say('err', +v < 0.5 ? 'נפח קטן מדי: התמיסה תהיה מהולה מדי והבליעה נמוכה מאוד.' : 'נפח גדול מדי: התמיסה תהיה מרוכזת מדי למדידה. לפי ההוראות מעבירים 0.5 מ"ל.');
        break;
      case 'fill': s.filled = true; say('ok', 'השלמתם במים מזוקקים ל-10 מ"ל.'); break;
      case 'mix':
        if (v === '1') { s.mixed = true; say('ok', 'נכון! בלי ערבוב הריכוז לא אחיד, והמדידה לא תהיה מדויקת.'); }
        else say('err', 'קודם צריך לערבב. בלי ערבוב התמיסה לא אחידה, והקיווטה עלולה לקבל ריכוז שגוי.');
        break;
      case 'cuv':
        if (+v === 3) { s.cuvette = true; say('ok', 'נכון! ממלאים כ-3/4 מהקיווטה. זכרו להחזיק אותה בצד המחוספס.'); }
        else say('err', +v < 3 ? 'מעט מדי: קרן האור לא תעבור דרך התמיסה.' : 'יותר מדי: הקיווטה תעלה על גדותיה. ממלאים כ-3/4 מהנפח, כלומר 3 מ"ל.');
        break;
      case 'wl':
        s.wl = +v; s.reading = null; s.inCell = null;
        if (s.zeroedAt !== s.wl) say('info', `שיניתם אורך גל ל-${v}nm. צריך לאפס מחדש עם בלנק.`);
        break;
      case 'zero': s.inCell = 'blank'; s.reading = null; s.zeroedAt = s.wl; say('ok', `המכשיר אופס ב-${s.wl}nm.`); break;
      case 'measure':
        if (s.zeroedAt !== s.wl) { say('err', 'שכחתם לאפס! בכל אורך גל צריך לאפס עם קיווטת בלנק לפני המדידה.'); break; }
        s.inCell = 'sample'; s.reading = SPECTRUM[s.wl]; s.spec[s.wl] = SPECTRUM[s.wl];
        say('ok', `נמדד: בליעה ${SPECTRUM[s.wl].toFixed(2)} ב-${s.wl}nm.`);
        break;
      case 'best':
        s.bestPick = +v;
        if (+v === BEST) say('ok', `נכון! ב-${BEST}nm הבליעה מקסימלית, ולכן זה אורך הגל המיטבי.`);
        else say('err', 'הסתכלו בגרף: איפה הבליעה הכי גבוהה?');
        break;
      case 'checkSeries': {
        readInputs();
        s.seriesChecked = true;
        s.seriesOk = V1.every((v1, i) => Math.abs(+s.water[i] - (10 - v1)) < 0.001 && Math.abs(+s.conc[i] - STOCK * v1 / 10) < 0.0006);
        say(s.seriesOk ? 'ok' : 'err', s.seriesOk ? 'מצוין! כל הנפחים והריכוזים נכונים.' : 'יש תאים אדומים. בדקו: מים = 10 פחות נפח תמיסת האם, וריכוז = 0.15 × V1 / 10.');
        break;
      }
      case 'showSeries':
        s.water = V1.map(v1 => String(+(10 - v1).toFixed(1)));
        s.conc = V1.map(v1 => String(+(STOCK * v1 / 10).toFixed(4)));
        s.seriesChecked = true; s.seriesOk = true; say('info', 'הפתרון מוצג בטבלה.');
        break;
      case 'calWl':
        s.calWl = +v; s.calZero = false; s.reading = null; s.inCell = null;
        if (+v !== BEST) say('err', `בשלב הראשון מצאתם שאורך הגל המיטבי הוא ${BEST}nm. גרף כיול בונים רק באורך הגל המיטבי.`);
        else say('ok', `המכשיר מכוון ל-${BEST}nm. עכשיו אפסו עם בלנק.`);
        break;
      case 'calZero':
        if (s.calWl !== BEST) { say('err', 'קודם כוונו את המכשיר לאורך הגל המיטבי.'); break; }
        if (s.calZero) say('info', 'המכשיר כבר מאופס. באורך גל אחד מספיק איפוס אחד בתחילת הקריאה.');
        else say('ok', 'המכשיר אופס. עכשיו מדדו את המבחנות.');
        s.calZero = true; s.inCell = 'blank'; s.reading = null;
        break;
      case 'calMeasure':
        if (s.calWl !== BEST) { say('err', 'כוונו קודם את המכשיר לאורך הגל המיטבי.'); break; }
        if (!s.calZero) { say('err', 'שכחתם לאפס עם בלנק לפני המדידה.'); break; }
        s.cal[+v] = CAL_A[+v]; s.reading = CAL_A[+v]; s.inCell = String(STOCK * V1[+v] / 10);
        say('ok', `מבחנה ${+v + 1}: בליעה ${CAL_A[+v].toFixed(2)}.`);
        break;
      case 'unkRead': s.unkRead = true; break;
      case 'unkCheck': {
        readInputs();
        const ans = stepUnknown().ans;
        const val = parseFloat(s.unkAns);
        if (isNaN(val)) { say('err', 'הקלידו מספר.'); break; }
        s.unkOk = Math.abs(val - ans) / ans < 0.05;
        say(s.unkOk ? 'ok' : 'err', s.unkOk
          ? `נכון! ריכוז הנעלם הוא כ-${ans.toFixed(4)} מ"ג/מ"ל.`
          : 'לא מדויק. הציבו את הבליעה (0.95) במקום y, החסירו את b וחלקו ב-a.');
        break;
      }
      case 'quiz': s.quiz[+btn.dataset.q] = +v; break;
    }
    draw();
  }

  function readInputs() {
    el.querySelectorAll('[data-in]').forEach(inp => {
      if (inp.dataset.in === 'water') s.water[+inp.dataset.i] = inp.value;
      if (inp.dataset.in === 'conc') s.conc[+inp.dataset.i] = inp.value;
      if (inp.dataset.in === 'unk') s.unkAns = inp.value;
    });
  }

  function draw() {
    const view = [stepDilution, stepSpectrum, stepSeries, stepCalibration, stepUnknown, stepSummary][s.step]();
    el.innerHTML = `<section class="sim" aria-label="סימולציה של מעבדה 1">
      <div class="sim-head"><h2>סימולציה: מהלך העבודה במעבדה</h2><button data-act="restart">התחל מחדש</button></div>
      <div class="progress">${STAGES.map((t, i) => `<span class="${i < s.step ? 'done' : i === s.step ? 'now' : ''}">${i + 1}. ${t}</span>`).join('')}</div>
      <div class="sim-body">
        <div class="sim-visual">${view.visual}</div>
        <div class="sim-ctrl" aria-live="polite">${view.ctrl}${s.msg ? `<div class="feedback ${s.msg.type}">${s.msg.text}</div>` : ''}</div>
      </div></section>`;
    el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { readInputs(); act(b.dataset.act, b.dataset.v, b); }));
    el.querySelectorAll('input[data-in]').forEach(inp => inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { readInputs(); act(inp.dataset.in === 'unk' ? 'unkCheck' : 'checkSeries'); }
    }));
  }

  return { mount };
})();

/* ================= simulations for labs 2-8 ================= */
const mix = (a, b, t) => {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b), k = Math.max(0, Math.min(1, t));
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
};
const CLEAR = 'rgba(210,230,245,.6)';
// SVG labels inherit the page's RTL direction; Latin-only labels (pGLO-, LB/amp) need LTR to keep +/- in place
const ltrIf = t => /[֐-׿]/.test(t) ? '' : ' direction="ltr"';

const Vis = {
  tubes(list, caption) {
    const w = 440, gap = w / (list.length + 1), tw = Math.max(14, Math.min(30, gap * .6));
    let g = `<svg viewBox="0 0 ${w} 250" aria-hidden="true"><rect x="16" y="172" width="${w - 32}" height="14" rx="4" fill="#cfd6e0"/>`;
    list.forEach((t, i) => {
      const x = gap * (i + 1), h = (t.fill == null ? .6 : t.fill) * 120;
      g += `<rect x="${(x - tw / 2).toFixed(1)}" y="40" width="${tw.toFixed(1)}" height="140" rx="${(tw / 2 - 1).toFixed(1)}" fill="#fff" stroke="${t.cap || '#6b7280'}" stroke-width="${t.cap ? 3 : 1}"/>`;
      if (h > 0) g += `<rect x="${(x - tw / 2 + 2).toFixed(1)}" y="${(178 - h).toFixed(1)}" width="${(tw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="${(tw / 2 - 3).toFixed(1)}" fill="${t.color || CLEAR}"/>`;
      g += `<text x="${x.toFixed(1)}" y="206" font-size="${list.length > 9 ? 10 : 12}" text-anchor="middle" fill="#1d2330"${ltrIf(t.label)}>${esc(t.label)}</text>`;
    });
    if (caption) g += `<text x="${w / 2}" y="236" font-size="13" text-anchor="middle" fill="#5b6475">${esc(caption)}</text>`;
    return g + '</svg>';
  },
  baths(list) {
    const w = 440, n = list.length, bw = (w - 10) / n - 10;
    let g = `<svg viewBox="0 0 ${w} 240" aria-hidden="true">`;
    list.forEach((b, i) => {
      const x = 10 + i * (bw + 10), water = b.water || '#cfe6f5';
      g += `<rect x="${x.toFixed(1)}" y="95" width="${bw.toFixed(1)}" height="105" rx="10" fill="${water}" stroke="#8aa4b8"/>`;
      (b.tubes || []).forEach((c, j) => {
        const tx = x + bw * (j + 1) / (b.tubes.length + 1);
        g += `<rect x="${(tx - 8).toFixed(1)}" y="40" width="16" height="125" rx="7" fill="#fff" stroke="#6b7280"/><rect x="${(tx - 6).toFixed(1)}" y="105" width="12" height="58" rx="5" fill="${c}"/>`;
      });
      g += `<rect x="${x.toFixed(1)}" y="125" width="${bw.toFixed(1)}" height="75" rx="10" fill="${water}" opacity=".45"/>`;
      g += `<text x="${(x + bw / 2).toFixed(1)}" y="222" font-size="13" text-anchor="middle" fill="#1d2330" font-weight="600">${esc(b.label)}</text>`;
    });
    return g + '</svg>';
  },
  plates(list) {
    const w = 440, n = list.length, r = Math.min(44, w / n / 2 - 8);
    let g = `<svg viewBox="0 0 ${w} 220" aria-hidden="true">`;
    list.forEach((p, i) => {
      const cx = w * (i + .5) / n, cy = 90;
      g += `<circle cx="${cx}" cy="${cy}" r="${r + 4}" fill="#d9dee7" stroke="#9aa5b5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.uv ? '#232a63' : '#f3ecd6'}"/>`;
      if (p.kind === 'lawn') g += `<circle cx="${cx}" cy="${cy}" r="${r - 5}" fill="${p.uv ? '#cfd3e6' : '#fbf8ee'}" opacity=".85"/>`;
      else if (p.kind === '?') g += `<text x="${cx}" y="${cy + 9}" font-size="26" text-anchor="middle" fill="#9aa5b5">?</text>`;
      else if (p.kind && p.kind !== 'none') {
        const col = { white: p.uv ? '#e6e8f2' : '#fffdf6', blue: '#2f6fb5', green: '#7dff95' }[p.kind];
        for (let k = 0; k < 16; k++) {
          const a = k * 2.39996, d = (r - 9) * Math.sqrt((k + .5) / 16);
          g += `<circle cx="${(cx + d * Math.cos(a)).toFixed(1)}" cy="${(cy + d * Math.sin(a)).toFixed(1)}" r="3.6" fill="${col}" stroke="${p.kind === 'white' ? '#c9c3b0' : 'none'}" stroke-width=".8"/>`;
        }
      }
      g += `<text x="${cx}" y="${cy + r + 24}" font-size="12" text-anchor="middle" fill="#1d2330" font-weight="600"${ltrIf(p.label)}>${esc(p.label)}</text>`;
      if (p.sub) g += `<text x="${cx}" y="${cy + r + 40}" font-size="11" text-anchor="middle" fill="#5b6475"${ltrIf(p.sub)}>${esc(p.sub)}</text>`;
    });
    return g + '</svg>';
  },
  flasks(list) {
    const n = list.length, w = 440, cw = w / n;
    let g = `<svg viewBox="0 0 ${w} 250" aria-hidden="true">`;
    list.forEach((f, i) => {
      const k = Math.min(1, cw / 190), ox = cw * i + cw / 2 - 220 * k;
      g += `<g transform="translate(${ox.toFixed(1)} ${(10 + (1 - k) * 150).toFixed(1)}) scale(${k.toFixed(3)})">`;
      g += `<path d="M195 30h50v60l60 110a14 14 0 0 1-12 20H147a14 14 0 0 1-12-20l60-110z" fill="#fff" stroke="#6b7280" stroke-width="2"/>`;
      g += `<path d="M162 150H278L305 200A14 14 0 0 1 293 220H147A14 14 0 0 1 135 200Z" fill="${f.color || CLEAR}"/>`;
      if (f.beads) for (let b = 0; b < 18; b++) g += `<circle cx="${152 + (b % 9) * 17 + (b > 8 ? 8 : 0)}" cy="${b > 8 ? 197 : 210}" r="7" fill="#efe2b8" stroke="#c9b98a"/>`;
      g += `</g><text x="${(cw * i + cw / 2).toFixed(1)}" y="242" font-size="13" text-anchor="middle" fill="#1d2330" font-weight="600">${esc(f.label)}</text>`;
    });
    return g + '</svg>';
  },
  spectro(wl, display, cell) {
    return `<svg viewBox="0 0 420 260" aria-hidden="true">
      <rect x="40" y="70" width="340" height="150" rx="16" fill="#cfd6e0" stroke="#9aa5b5"/>
      <rect x="40" y="70" width="340" height="40" rx="16" fill="#b7c1cf"/>
      <rect x="70" y="128" width="150" height="60" rx="6" fill="#16323a"/>
      <text x="145" y="152" font-size="13" fill="#7ee3c3" text-anchor="middle" font-family="Consolas, monospace">λ = ${wl} nm</text>
      <text x="145" y="176" font-size="18" fill="#7ee3c3" text-anchor="middle" font-family="Consolas, monospace">${display}</text>
      <rect x="260" y="40" width="70" height="80" rx="6" fill="#8f9bad"/>
      <rect x="282" y="20" width="26" height="70" rx="3" fill="#fff" stroke="#6b7280"/>
      ${cell ? `<rect x="284" y="38" width="22" height="50" fill="${cell}"/>` : ''}
      <text x="210" y="245" font-size="13" text-anchor="middle" fill="#5b6475">ספקטרופוטומטר</text></svg>`;
  },
};

/* Step types: choice (default: q + opts [text, correct, feedback]), predict (items + opts), titrate (samples). */
function makeSim(def) {
  let el, s;
  const N = def.steps.length;
  const fresh = () => ({ i: 0, ok: false, pick: null, picks: {}, checked: false, msg: null, quiz: {}, ti: { cur: 0, ml: 0, rec: [] } });
  const say = (type, text) => { s.msg = { type, text }; };

  function task(st) {
    if (st.type === 'predict') {
      return st.items.map((it, k) => {
        const p = s.picks[k], mark = s.checked && p !== undefined ? (p === it.ans ? ' ✓' : ' ✗') : '';
        return `<div class="quiz-q"><p>${it.label}${mark}</p><div class="btn-row">${st.opts.map((o, v) =>
          `<button class="btn ${p === v ? 'sel' : ''}" data-act="pp" data-k="${k}" data-v="${v}">${o}</button>`).join('')}</div></div>`;
      }).join('') + (s.ok ? '' : `<div class="btn-row"><button class="btn primary" data-act="check">בדוק</button></div>`);
    }
    if (st.type === 'titrate') {
      const t = s.ti, smp = st.samples[t.cur];
      let h = `<div class="table-wrap"><table><tr><th>דגימה</th><th>NaOH (מ"ל)</th></tr>${st.samples.map((x, k) =>
        `<tr><td>${x.label}</td><td>${t.rec[k] != null ? t.rec[k].toFixed(1) : (k === t.cur ? '…' : '')}</td></tr>`).join('')}</table></div>`;
      if (smp) h += `<p>מטטרים עכשיו: <b>${smp.label}</b> · נוסף עד עכשיו: <b class="ltr">${t.ml.toFixed(1)} ml</b></p>
        <div class="btn-row"><button class="btn" data-act="drop" data-v="1">+1 מ"ל</button><button class="btn" data-act="drop" data-v="0.2">+0.2 מ"ל (טפטוף)</button><button class="btn primary" data-act="rec">הצבע ורוד יציב: רשום</button></div>`;
      return h;
    }
    return `<p><b>${st.q}</b></p><div class="btn-row">${st.opts.map((o, v) =>
      `<button class="btn ${s.pick === v ? 'sel' : ''}" data-act="pick" data-v="${v}">${o[0]}</button>`).join('')}</div>`;
  }

  function draw() {
    const done = s.i >= N, st = def.steps[s.i];
    let visual, ctrl;
    if (done) {
      visual = def.summary.visual();
      ctrl = `<h3>סיכום</h3><ul>${def.summary.points.map(p => `<li>${p}</li>`).join('')}</ul><h3>בדקו את עצמכם</h3>` +
        def.summary.quiz.map((it, qi) => {
          const p = s.quiz[qi];
          return `<div class="quiz-q"><p>${qi + 1}. ${it.q}</p><div class="btn-row">${it.opts.map((o, oi) =>
            `<button class="btn ${p === oi ? 'sel' : ''}" data-act="quiz" data-k="${qi}" data-v="${oi}">${o}</button>`).join('')}</div>` +
            (p === undefined ? '' : p === it.a ? '<div class="feedback ok">נכון!</div>' : '<div class="feedback err">לא מדויק, נסו שוב.</div>') + '</div>';
        }).join('') + `<div class="btn-row"><button class="btn" data-act="restart">התחל מחדש</button></div>`;
    } else {
      visual = st.visual(s);
      ctrl = `<h3>שלב ${s.i + 1}: ${st.title}</h3>${typeof st.text === 'function' ? st.text(s) : `<p>${st.text}</p>`}${task(st)}`;
      if (s.msg) ctrl += `<div class="feedback ${s.msg.type}">${s.msg.text}</div>`;
      if (s.ok && st.after) ctrl += st.after(s);
      if (s.ok) ctrl += `<div class="btn-row"><button class="btn primary" data-act="next">${s.i === N - 1 ? 'לסיכום ←' : 'לשלב הבא ←'}</button></div>`;
      if (st.why) ctrl += `<div class="why"><b>למה?</b> ${st.why}</div>`;
    }
    const stages = def.steps.map(x => x.short).concat('סיכום');
    el.innerHTML = `<section class="sim" aria-label="סימולציה של המעבדה">
      <div class="sim-head"><h2>סימולציה: מהלך העבודה במעבדה</h2><button data-act="restart">התחל מחדש</button></div>
      <div class="progress">${stages.map((t, k) => `<span class="${k < s.i ? 'done' : k === s.i ? 'now' : ''}">${k + 1}. ${t}</span>`).join('')}</div>
      <div class="sim-body"><div class="sim-visual">${visual}</div><div class="sim-ctrl" aria-live="polite">${ctrl}</div></div></section>`;
    el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset)));
  }

  function act(d) {
    const st = def.steps[s.i], v = d.v == null ? null : +d.v;
    switch (d.act) {
      case 'restart': s = fresh(); break;
      case 'next':
        Object.assign(s, { i: s.i + 1, ok: false, pick: null, picks: {}, checked: false, msg: null, ti: { cur: 0, ml: 0, rec: [] } });
        draw(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return;
      case 'pick': {
        if (s.ok) break;
        const o = st.opts[v]; s.pick = v;
        if (o[1]) { s.ok = true; say('ok', o[2] || 'נכון!'); } else say('err', o[2] || 'לא מדויק, נסו שוב.');
        break;
      }
      case 'pp': if (!s.ok) { s.picks[+d.k] = v; s.checked = false; s.msg = null; } break;
      case 'check': {
        s.checked = true;
        if (st.items.every((it, k) => s.picks[k] === it.ans)) { s.ok = true; say('ok', st.okMsg || 'מצוין! כל החיזויים נכונים.'); }
        else say('err', st.items.some((_, k) => s.picks[k] === undefined) ? 'בחרו תשובה לכל אחת מהצלחות.' : 'חלק מהחיזויים לא נכונים (מסומנים ב-✗). חשבו שוב.');
        break;
      }
      case 'drop': s.ti.ml = Math.round((s.ti.ml + v) * 10) / 10; s.msg = null; break;
      case 'rec': {
        const t = s.ti, smp = st.samples[t.cur];
        if (t.ml < smp.target) say('err', 'הצבע עדיין לא ורוד. המשיכו להוסיף בסיס.');
        else if (t.ml > smp.target + 0.4) { say('err', 'עברתם את נקודת הסיום: הצבע ורוד כהה. מתחילים את הדגימה מחדש, ומתקרבים לסוף בטפטוף.'); t.ml = 0; }
        else {
          t.rec[t.cur] = t.ml; t.cur++; t.ml = 0;
          if (t.cur >= st.samples.length) { s.ok = true; say('ok', 'כל הדגימות טוטרו!'); }
          else say('ok', `נרשם. עוברים לדגימה הבאה: ${st.samples[t.cur].label}`);
        }
        break;
      }
      case 'quiz': s.quiz[+d.k] = v; break;
    }
    draw();
  }
  return { mount(c) { el = c; s = fresh(); draw(); } };
}
