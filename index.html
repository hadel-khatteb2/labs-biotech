<html lang="he" dir="rtl">
<head>

<title>מעבדות ביוטכנולוגיה</title>

<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --text: #1d2330;
    --muted: #5b6475;
    --border: #d9dee7;
    --accent: #0f6e6e;
    --accent-soft: #e2f2f1;
    --accent-text: #ffffff;
    --pink: #b0247a;
    --ok: #1e7b3a;
    --ok-soft: #e4f4e8;
    --err: #b42318;
    --err-soft: #fdecea;
    --info-soft: #eef3fc;
    --info: #2a56a8;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Arial Hebrew", Arial, "Noto Sans Hebrew", sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  a { color: var(--accent); }
  button { font: inherit; }
  :focus-visible { outline: 3px solid #f4b400; outline-offset: 2px; }

  /* ---------- header ---------- */
  .site-header {
    background: var(--accent);
    color: var(--accent-text);
    padding: 18px 16px 0;
  }
  .site-header .inner { max-width: 1100px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 1.45rem; line-height: 1.3; }
  .badge {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 2px 12px;
    font-size: .85rem;
  }
  .brand p { margin: 2px 0 0; opacity: .9; font-size: .95rem; width: 100%; }

  .lab-nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    margin-top: 14px;
    scrollbar-width: thin;
  }
  .lab-nav button {
    flex: 0 0 auto;
    background: transparent;
    color: var(--accent-text);
    border: 0;
    border-radius: 10px 10px 0 0;
    padding: 10px 14px;
    cursor: pointer;
    opacity: .85;
    white-space: nowrap;
  }
  .lab-nav button:hover { opacity: 1; background: rgba(255,255,255,.12); }
  .lab-nav button[aria-selected="true"] {
    background: var(--bg);
    color: var(--accent);
    opacity: 1;
    font-weight: 700;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ---------- home ---------- */
  .intro { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .intro h2 { margin: 0 0 6px; font-size: 1.25rem; }
  .intro p { margin: 0; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 14px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    color: var(--text);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    text-align: right;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--text);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .num { color: var(--accent); font-weight: 700; font-size: .9rem; }
  .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
  .card .area { font-size: .85rem; color: var(--muted); }
  .card .status { font-size: .8rem; margin-top: auto; padding-top: 6px; }
  .status.ready { color: var(--ok); font-weight: 600; }
  .status.soon { color: var(--muted); }

  /* ---------- lab page ---------- */
  .lab-title { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.35; }
  .lab-sub { margin: 0 0 18px; color: var(--muted); }
  .role-tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--border); overflow-x: auto; }
  .role-tabs button {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    padding: 10px 16px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
  }
  .role-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: 8px 22px 24px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 1.2rem; margin: 22px 0 8px; color: var(--accent); }
  .panel h3 { font-size: 1.05rem; margin: 18px 0 6px; }
  .panel ol, .panel ul { padding-inline-start: 22px; }
  .panel li { margin: 4px 0; }
  .note { background: var(--info-soft); border-inline-start: 4px solid var(--info); padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
  .warn { background: #fff6e5; border-inline-start: 4px solid #c77700; padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; margin: 10px 0; min-width: 280px; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: center; }
  th { background: var(--surface-2); font-weight: 600; }
  .formula { direction: ltr; unicode-bidi: isolate; font-family: Consolas, "Courier New", monospace; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .shared-bg { border: 1px solid var(--border); border-radius: 10px; padding: 0 16px; margin: 12px 0; background: var(--surface-2); }
  .shared-bg summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--accent); }
  .shared-bg[open] { padding-bottom: 12px; }

  /* ---------- simulation ---------- */
  .sim { margin-top: 30px; border: 2px solid var(--accent); border-radius: var(--radius); overflow: hidden; }
  .sim-head { background: var(--accent); color: var(--accent-text); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sim-head h2 { margin: 0; color: var(--accent-text); font-size: 1.15rem; }
  .sim-head button { background: rgba(255,255,255,.15); color: var(--accent-text); border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .progress { display: flex; gap: 6px; padding: 12px 18px; background: var(--accent-soft); flex-wrap: wrap; }
  .progress span { font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .progress span.done { background: var(--ok-soft); color: var(--ok); border-color: #b9dfc3; }
  .progress span.now { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .sim-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; padding: 18px; background: var(--surface); }
  .sim-visual { background: var(--surface-2); border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: center; min-height: 260px; }
  .sim-visual svg { width: 100%; height: auto; max-width: 460px; }
  .sim-ctrl h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .sim-ctrl .why { font-size: .9rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin: 8px 0 12px; }
  .sim-ctrl .why b { color: var(--text); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .btn {
    border: 1px solid var(--accent);
    background: var(--surface);
    color: var(--accent);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.sel { background: var(--accent); color: var(--accent-text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .feedback { border-radius: 8px; padding: 9px 12px; margin: 10px 0; font-size: .95rem; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok); }
  .feedback.err { background: var(--err-soft); color: var(--err); }
  .feedback.info { background: var(--info-soft); color: var(--info); }
  .sim-ctrl input[type="number"] { width: 92px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font: inherit; text-align: center; direction: ltr; }
  .sim-ctrl table { font-size: .9rem; }
  .sim-ctrl td.good { background: var(--ok-soft); }
  .sim-ctrl td.bad { background: var(--err-soft); }
  .chart { width: 100%; max-width: 440px; display: block; margin: 8px 0; }
  .quiz-q { margin: 14px 0; }
  .quiz-q p { margin: 0 0 6px; font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px 16px 40px; }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .sim-body { grid-template-columns: 1fr; }
    .panel { padding: 6px 14px 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>

<!-- ================= Lab 1 content ================= -->
<template id="lab1-student">
  <h2>מטרת המעבדה</h2>
  <p>יצירת ספקטרום בליעה של תמיסת אשלגן פרמנגנט (<span class="ltr">KMnO₄</span>) כדי לקבוע את אורך הגל האופטימלי לבניית גרף כיול של התמיסה, ומדידת הריכוז של תמיסת <span class="ltr">KMnO₄</span> במבחנת ה"נעלם" בשיטה ספקטרופוטומטרית.</p>

  <h2>רקע עיוני</h2>
  <p>אשלגן על-מנגני (<span class="ltr">KMnO₄</span>) הוא תרכובת של אשלגן, מנגן וחמצן. כשהוא מומס במים מתקבלת תמיסה סגולה. ככל שהתמיסה מרוכזת יותר, צבעה כהה יותר והיא בולעת יותר אור.</p>
  <p>המעבדה מתחלקת לשלושה שלבים:</p>
  <ol>
    <li><b>בניית ספקטרום בליעה</b>: מוצאים את אורך הגל שבו הבליעה מקסימלית. זהו אורך הגל המיטבי, ובו מתקיים חוק בר-למברט: קשר ישר (לינארי) בין ריכוז התמיסה לבין ערך הבליעה.</li>
    <li><b>בניית גרף כיול</b>: מודדים בליעה של כמה ריכוזים ידועים, ובונים גרף ישר עם משוואת קו.</li>
    <li><b>מציאת הריכוז ה"נעלם"</b>: מודדים את הבליעה של תמיסה שהריכוז שלה לא ידוע, ומחשבים את הריכוז בעזרת משוואת הקו.</li>
  </ol>

  <h2>שלב ראשון: בניית ספקטרום בליעה</h2>
  <ol>
    <li>לפניכם "תמיסת אם" של <span class="ltr">KMnO₄</span> בריכוז 0.15 מ"ג/מ"ל.</li>
    <li>העבירו בעזרת פיפטור 0.5 מ"ל (500 מיקרוליטר) מתמיסת האם למבחנה, והשלימו במים מזוקקים לנפח של 10 מ"ל. ערבבו על ידי פיפטור או היפוך המבחנה הסגורה בפקק.</li>
    <li>העבירו בעזרת פיפטור 3 מ"ל מהתמיסה המהולה לקיווטה.</li>
    <li>אפסו את הספקטרופוטומטר עם קיווטה שמכילה 3 מ"ל מים מזוקקים (קיווטת בלנק) באורך גל 500nm.</li>
    <li>קראו את ערך הבליעה של התמיסה המהולה ב-500nm ורשמו בטבלה 3.1.</li>
    <li>חזרו על סעיפים 4 ו-5 לכל אורכי הגל בטבלה, מ-500nm עד 600nm.</li>
    <li>העתיקו את הטבלה לגיליון אקסל ושרטטו גרף ספקטרום בליעה, עם כותרת וכותרות צירים כולל יחידות.</li>
    <li>קבעו לפי הטבלה והגרף מהו אורך הגל המיטבי לבליעה מקסימלית.</li>
  </ol>
  <div class="note">
    <b>הערות לעבודה עם הספקטרופוטומטר:</b>
    <ul>
      <li>יש לאפס את המכשיר <b>בכל אחד מאורכי הגל</b>, עם קיווטה שמכילה נפח זהה של מים מזוקקים בלבד (קיווטת בלנק).</li>
      <li>ממלאים את הקיווטה לכ-3/4 מנפחה. בודקים שנפח של 3 מ"ל מתאים לקיווטה, ואם לא, מתאימים את הנפח.</li>
      <li>מחזיקים את הקיווטה רק בצד המחוספס, ומנקים אותה בנייר לפני ההכנסה למכשיר, כדי שהצדדים השקופים לא יתלכלכו.</li>
    </ul>
  </div>
  <div class="table-wrap"><table>
    <caption><b>טבלה 3.1:</b> ספקטרום הבליעה של תמיסת <span class="ltr">KMnO₄</span></caption>
    <tr><th>אורך גל (nm)</th><th>ערך הבליעה</th></tr>
    <tr><td>500</td><td></td></tr><tr><td>520</td><td></td></tr><tr><td>540</td><td></td></tr>
    <tr><td>560</td><td></td></tr><tr><td>580</td><td></td></tr><tr><td>600</td><td></td></tr>
  </table></div>

  <h2>שלב שני: בניית גרף כיול</h2>
  <ol>
    <li>לפניכם "תמיסת אם" של <span class="ltr">KMnO₄</span> בריכוז 0.15 מ"ג/מ"ל.</li>
    <li>מספרו את המבחנות 1–5.</li>
    <li>העבירו לכל מבחנה את נפח תמיסת האם שבטבלה 3.2, והשלימו במים מזוקקים לנפח של 10 מ"ל. ערבבו.</li>
    <li>כוונו את הספקטרופוטומטר לאורך הגל המיטבי שמצאתם בשלב הראשון.</li>
    <li>אפסו את המכשיר עם קיווטת בלנק (3 מ"ל מים מזוקקים).</li>
    <li>העבירו 3 מ"ל מכל מבחנה לקיווטה, קראו את ערך הבליעה ורשמו בטבלה 3.2.</li>
    <li>העתיקו את הטבלה לאקסל וחשבו את ריכוז כל תמיסה לפי <span class="formula">C1·V1 = C2·V2</span>.</li>
    <li>צרו גרף שבו הריכוז הוא המשתנה הבלתי תלוי וערך הבליעה הוא המשתנה התלוי, ומצאו את משוואת הקו הישר.</li>
  </ol>
  <div class="warn"><b>שימו לב:</b> בשלב זה מאפסים עם הבלנק פעם אחת בלבד, בתחילת הקריאה, כי עובדים באורך גל אחד.</div>
  <p>
    <span class="formula">C1</span> = ריכוז תמיסת האם (0.15 מ"ג/מ"ל) ·
    <span class="formula">V1</span> = נפח תמיסת האם שהוספתם ·
    <span class="formula">C2</span> = הריכוז אחרי המיהול ·
    <span class="formula">V2</span> = הנפח הסופי (10 מ"ל)
  </p>
  <div class="table-wrap"><table>
    <caption><b>טבלה 3.2:</b> ערך הבליעה כתלות בריכוז</caption>
    <tr><th>מבחנה</th><th>תמיסת אם (מ"ל)</th><th>מים (מ"ל)</th><th>ריכוז מהול (מ"ג/מ"ל)</th><th>ערך הבליעה</th></tr>
    <tr><td>1</td><td>0.5</td><td>9.5</td><td></td><td></td></tr>
    <tr><td>2</td><td>1.0</td><td>9.0</td><td></td><td></td></tr>
    <tr><td>3</td><td>1.5</td><td>8.5</td><td></td><td></td></tr>
    <tr><td>4</td><td>2.0</td><td>8.0</td><td></td><td></td></tr>

  </table></div>

  <h2>שלב שלישי: מציאת הריכוז ה"נעלם"</h2>
  <ol>
    <li>לפניכם "תמיסת נעלם" של <span class="ltr">KMnO₄</span> בריכוז לא ידוע.</li>
    <li>כוונו את המכשיר לאורך הגל המיטבי, ואפסו עם קיווטת בלנק.</li>
    <li>העבירו 3 מ"ל מתמיסת הנעלם לקיווטה, קראו את ערך הבליעה ורשמו בטבלה 3.2.</li>
    <li>חשבו באקסל את ריכוז הנעלם: הציבו את ערך הבליעה במקום <span class="formula">Y</span> במשוואת הקו הישר, ובודדו את <span class="formula">X</span>.</li>
  </ol>

  <h2>ניתוח תוצאות, דיון ומסקנות</h2>
  <h3>תוצאות הניסוי</h3>
  <ol>
    <li>הציגו את הטבלאות והגרפים של כל שלבי הניסוי.</li>
    <li>תארו במילים את תוצאות הניסוי בכל שלביו.</li>
  </ol>
  <h3>שאלות לדיון</h3>
  <ol>
    <li>האם התוצאות תואמות את הרקע העיוני על חוק בר-למברט וגרף הכיול? הסבירו.</li>
    <li>בניתוח השתמשנו בשתי נוסחאות לקביעת ריכוז. מהן, ומתי משתמשים בכל אחת?</li>
    <li>מדוע מאפסים את המכשיר בעזרת קיווטת בלנק, ומדוע היא מכילה מים מזוקקים בלבד?</li>
    <li>בשלב הראשון בחרתם את אורך הגל המיטבי:
      <ol type="א">
        <li>כיצד מצאתם אותו?</li>
        <li>מדוע הוא מתאים לבניית גרף כיול, ועל איזה חוק הוא מבוסס?</li>

  <p>חלבונים ופפטידים (חלבונים קצרים) הם שרשראות של חומצות אמינו, שקשורות זו לזו בקשר פפטידי. החלבונים נבדלים זה מזה ברצף ובמספר חומצות האמינו, ולכן יש בתאים מגוון עצום של חלבונים עם תכונות שונות.</p>
  <p><b>בדיקת ביורט (Biuret)</b> מתאימה לחלבונים ולפפטידים שיש בהם לפחות שני קשרים פפטידיים. השיטה מזהה חלבון בריכוזים של 1 עד 10 מ"ג/מ"ל.</p>

  <p>מגיב הביורט נשמר 2–3 שבועות במקרר.</p>

    <p><b>אנזימים</b> הם זרזים ביולוגיים: קבוצה ייחודית של חלבונים שמגבירים את הקצב של תגובות כימיות באורגניזמים.</p>
    <p>חלבונים בנויים משרשרת של חומצות אמינו שקשורות בקשר פפטידי. בתאים יש 20 חומצות אמינו שונות. לכל אחת יש קצה קרבוקסילי (<span class="ltr">COOH</span>), קצה אמיני (<span class="ltr">NH₂</span>) וקבוצה צדדית ייחודית שנקראת "שייר" ומסומנת <span class="ltr">R</span>. יש שיירים טעונים (חיוביים או שליליים), שיירים הידרופוביים ושיירים עם מולקולות מיוחדות. הרצף ומספר חומצות האמינו קובעים את המבנה המרחבי הפעיל של החלבון.</p>
    <p>אנזימים פועלים כזרזים כי הם מורידים את האנרגיה שנדרשת לתהליכים הכימיים בתא, ויוצרים תנאים מיטביים למפגש בין מרכיבי התגובה. בלי אנזימים, רוב התגובות בתא היו איטיות מדי לקיום החיים. חסר באנזים אחד עלול לפגוע בתפקוד התא או הגוף, ויש מחלות תורשתיות רבות שנובעות מפעילות לקויה של אנזים.</p>
    <h3>תגובת אנזים-מצע</h3>
    <p>המולקולה שעליה פועל האנזים נקראת <b>מצע</b> (סובסטרט). כל אנזים פועל על מצע ייחודי לו: האנזים נקשר למצע בזכות התאמה מבנית וכימית ספציפית, ונוצר <b>קומפלקס</b> (תצמיד) אנזים-מצע. האנזים מזרז את התגובה, התוצר משתחרר, והאנזים עצמו לא משתנה. לכן אנזים אחד יכול לזרז את אותה תגובה פעמים רבות.</p>
    <h3>האתר הפעיל</h3>
    <p>הקיפול המרחבי של האנזים מציב חומצות אמינו מסוימות באזור שבו מתבצעת התגובה, שנקרא <b>האתר הפעיל</b>. האתר הפעיל מותאם למצע מבחינה מבנית, וגם במשיכה כימית וחשמלית של חומצות האמינו שבו.</p>
    <h3>קצב התגובה האנזימטית</h3>
    <p>קצב התגובה הוא מספר מולקולות התוצר שנוצרות ביחידת זמן. אפשר למדוד אותו בשתי דרכים: לפי קצב היווצרות התוצר, או לפי קצב היעלמות המצע.</p>
    <h3>גורמים שמשפיעים על קצב התגובה</h3>
    <ol>
      <li><b>טמפרטורה:</b> לכל אנזים יש טמפרטורה מיטבית (אופטימלית), שבה הקצב הגבוה ביותר. היא מותאמת לסביבת הגידול של האורגניזם: בגוף האדם כ-<span class="ltr">37°C</span>, בחיידק <i class="ltr">Thermus aquaticus</i> כ-<span class="ltr">72°C</span>, ובתולעים בקרקע כ-<span class="ltr">20°C</span>.
        <ul>
          <li>כשהטמפרטורה עולה, המולקולות נעות מהר יותר ונפגשות בתדירות גבוהה יותר, ולכן הקצב עולה.</li>
          <li>בטמפרטורות גבוהות מדי משתנה המבנה המרחבי של האנזים, ההתאמה בין האתר הפעיל למצע נפגעת, והקצב יורד. הפגיעה במבנה נקראת <b>דנטורציה</b>.</li>
        </ul>
      </li>
      <li><b>ערך ה-pH:</b> הקישור בין האנזים למצע תלוי במטען של השיירים (<span class="ltr">R</span>) של חומצות האמינו. לכל אנזים יש <span class="ltr">pH</span> אופטימלי שבו מבנהו תקין. שינוי ב-<span class="ltr">pH</span> משנה את המטען של השיירים, פוגע במבנה ובקישור למצע, ולכן גם <span class="ltr">pH</span> גבוה וגם נמוך מהאופטימלי פוגעים בפעילות. ככל שה-<span class="ltr">pH</span> בסיסי יותר, המטען באתר הפעיל שלילי יותר, וככל שהוא חומצי יותר, המטען חיובי יותר.</li>
      <li><b>ריכוז האנזים:</b> ככל שיש יותר אנזים, גדל הסיכוי למפגש עם המצע והקצב עולה. אבל כשריכוז המצע קבוע, העלייה בקצב מתמתנת ונעצרת, כי המצע הופך לגורם מגביל.</li>
      <li><b>ריכוז המצע:</b> ככל שיש יותר מצע, הקצב עולה. כשריכוז האנזים קבוע, העלייה מתמתנת ונעצרת, כי האנזים הופך לגורם מגביל.</li>
    </ol>

  <h2>רקע עיוני</h2>
  <div data-include="enzyme-bg"></div>
  <p><b>אינברטאז</b> הוא אנזים שנמצא באורגניזמים רבים, ובהם שמרים, צמחים ובעלי חיים. הוא מזרז את פירוק הדו-סוכר <b>סוכרוז</b> לשני חד-סוכרים: <b>גלוקוז</b> ו<b>פרוקטוז</b>. סוכרוז אינו סוכר מחזר, אבל תוצרי הפירוק שלו, גלוקוז ופרוקטוז, הם סוכרים מחזרים. בעובדה הזו משתמשים כדי לקבוע את פעילות האינברטאז, בעזרת <b>מגיב סמנר</b>.</p>
  <p>מגיב סמנר הוא אינדיקטור בעל <span class="ltr">pH</span> בסיסי, שמשנה את צבעו בחום בנוכחות סוכרים מחזרים. בלי סוכר מחזר הצבע צהוב, וככל שריכוז הסוכר המחזר גבוה יותר הצבע כהה יותר (כתום-חום). כך אפשר לקבוע את מידת התגובה.</p>

  <h2>רקע עיוני</h2>
  <div data-include="enzyme-bg"></div>
  <h3>השפעת ריכוז המצע וגרף מיכאליס-מנטן</h3>
  <p>גרף השפעת ריכוז המצע על פעילות האנזים נקרא גם <b>גרף מיכאליס-מנטן</b>, על שם החוקרים לאונור מיכאליס ומוד מנטן. הגרף מתאר את קצב (מהירות) התגובה <span class="ltr">V</span> של אנזים בריכוז קבוע, כתלות בריכוז המצע <span class="ltr">[S]</span>. מהירות התגובה <span class="ltr">V</span> היא מספר התגובות שהאנזים מזרז ביחידת זמן. הגרף לא מתאר אנזים בודד, אלא מולקולות רבות של אנזים בנפח מסוים של תמיסה.</p>
  <p>לפי הגרף נקבעו שני קבועים קינטיים, שמתארים תגובה של אנזים ומצע מסוימים בתנאים מוגדרים:</p>
  <ol type="א">
    <li><b><span class="ltr">V<sub>max</sub></span>: המהירות המקסימלית של פעילות האנזים.</b> הערך מתקבל כשהאתר הפעיל של האנזימים רווי במולקולות מצע, ולכן תוספת מצע לא מעלה את מהירות התגובה.</li>
    <li><b><span class="ltr">K<sub>M</sub></span>: קבוע מיכאליס-מנטן, ריכוז המצע בחצי מהמהירות המרבית (<span class="ltr">V<sub>max</sub>/2</span>).</b> הערך מייצג את מידת הזיקה (המשיכה) בתצמיד אנזים-מצע. ערך נמוך מצביע על זיקה (אפיניות) גבוהה ותגובה מהירה, וערך גבוה מצביע על זיקה נמוכה.</li>
  </ol>
  <h3>מעכבים אנזימטיים</h3>
  <p>מעכבים אנזימטיים הם מולקולות טבעיות או סינתטיות שנקשרות לאנזימים ומעכבות את יכולתם לזרז תגובות. בתאים ובגוף הם מווסתים תגובות ומונעים תגובת יתר. יש להם תפקיד חשוב בתעשיית התרופות: תרופות אנטיביוטיות ואנטי-ויראליות רבות הן מעכבים, ובהן הקוקטייל נגד נגיף ה-<span class="ltr">HIV</span> ותרופות נגד נגיף הקורונה, שמעכבות אנזימים (פרוטאזות) שחיוניים ליצירת נגיפים חדשים.</p>
  <ol type="א">
    <li><b>מעכבים תחרותיים:</b> מולקולות שנקשרות לאתר הפעיל, ובדרך כלל דומות במבנה למצע. הן מתחרות במצע על הקישור לאתר הפעיל, ולכן נוצר פחות תצמיד אנזים-מצע. הזיקה בין האנזים למצע יורדת, ולכן ערך <span class="ltr">K<sub>M</sub></span> גבוה יותר מאשר בלי מעכב.</li>
    <li><b>מעכבים לא תחרותיים:</b> מולקולות שלא דומות למצע ולא מתחרות על האתר הפעיל, אבל הקישור שלהן לאנזים מונע ממנו לפעול. לכן הקצב יורד, וערך <span class="ltr">V<sub>max</sub></span> יורד בהתאם.</li>
  </ol>
  <h3>האנזים בטא עמילאז</h3>

  <p>מעקב אחרי תהליכי נשימה בנוכחות גלוקוז, על ידי שמרי אפייה מקובעים באלגינט, בשימוש ראשון ובשימוש חוזר. המעקב נעשה בטיטרציה של החומצה הפחמתית שנוצרת בתהליך הנשימה.</p>

  <h2>רקע עיוני</h2>
  <div data-include="enzyme-bg"></div>
  <p><b>שמרים</b> הם אורגניזמים חד-תאיים אאוקריוטיים, ששייכים לממלכת הפטריות. הם צרכנים שניזונים מסוכרים ממקורות שונים, ולא מבצעים פוטוסינתזה. שמרים הם <b>אנאירובים פקולטטיביים</b>: בסביבה עם חמצן הם מפיקים אנרגיה בנשימה תאית אירובית, ובסביבה בלי חמצן הם עוברים לנשימה אנאירובית, שנקראת גם <b>תסיסה</b>.</p>
  <p><b>נשימה תאית אירובית:</b> <span class="formula">C₆H₁₂O₆ + 6O₂ → 6H₂O + 6CO₂ + 38ATP</span></p>
  <p><b>נשימה אנאירובית (תסיסה):</b> <span class="formula">C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ + 2ATP</span></p>
  <p>שני התהליכים מבוססים על פירוק גלוקוז. בנשימה התאית נוצרים תוצרים אנאורגניים (מים ופחמן דו-חמצני) ומספר גדול של מולקולות <span class="ltr">ATP</span>. בתסיסה נוצר תוצר אורגני, אתנול (<span class="ltr">C₂H₅OH</span>), ומעט <span class="ltr">ATP</span>. לכן התסיסה הרבה פחות יעילה אנרגטית, אבל היא מאפשרת לשמרים לשרוד בלי חמצן.</p>
  <p>התוצרים של השמרים משמשים בתעשיית המזון: בתפיחת בצק אפייה, הפחמן הדו-חמצני נלכד בבצק וגורם לתפיחה. בייצור משקאות כמו יין ובירה משתמשים באתנול ובפחמן הדו-חמצני מהתסיסה (תסיסה כוהלית). שמרים יכולים לנצל גם חד-סוכרים אחרים, כמו גלקטוז ופרוקטוז, ולפרק דו-סוכרים בעזרת אנזימים. לדוגמה, האינברטאז שבשמרים מפרק סוכרוז לגלוקוז ולפרוקטוז.</p>
  <p>בתעשיית הביוטכנולוגיה המתקדמת משתמשים בשמרים לייצור חלבונים טבעיים או רקומביננטיים (חלבונים שנוצרים בשמרים אחרי הנדסה גנטית). זה ייצור יעיל וחסכוני, כי תאי השמרים מתרבים מהר ותנאי הגידול שלהם פשוטים, ובכל זאת הם מבטאים חלבונים בדומה לתאי צמחים ובעלי חיים. לדוגמה, חברות סטרט-אפ מייצרות היום חלבוני חלב אם או חלב פרה משמרים מהונדסים.</p>
  <h3>קיבוע תאים</h3>
  <p>אחת הדרכים להשתמש בשמרים בתעשייה היא לקבע אותם בתוך חלקיקי ג'ל פולימרי שאינו מסיס, "לארוז" את התאים בתוכו. לקיבוע אפשר להשתמש בפולימרים שונים, ולכל אחד יתרונות וחסרונות: חדירות, חוזק, רעילות ועמידות כימית. שיטה מקובלת היא רב-סוכרים כמו אגר ו<b>אלגינט</b>, שמופקים מאצות ויכולים לספוח מים וליצור ג'ל.</p>
  <p>בניסוי משתמשים בשמרי אפייה מסוג <i class="ltr">Saccharomyces cerevisiae</i> שקובעו בתמיסת נתרן אלגינט. זה פולימר מסיס שמרחפים בו את התאים. כשהפולימר עם השמרים בא במגע עם תמיסת סידן כלורי, מתקבל מלח קשה תמס של אלגינט הסידן, שיוצר נשאים כדוריים ובתוכם כלואים תאי השמרים. אפשר לקבע באלגינט גם אנזימים, ולא רק תאים שלמים, וגם בבישול מולקולרי.</p>
  <p><b>היתרון</b> בקיבוע: אפשר להפריד את השמרים המקובעים ממערכת התגובה ולהשתמש בהם שוב בתהליכים נוספים, או להכין עמודה של שמרים מקובעים ולהעביר דרכה מצע ברציפות. לפעמים הקיבוע גם מגן על התאים. <b>החיסרון:</b> הסיכוי למפגש בין השמרים למצע יורד, כי היחס בין שטח הפנים לנפח קטן, ולכן המטבוליזם איטי יותר.</p>
  <h3>איך עוקבים אחרי הנשימה והתסיסה?</h3>
  <ol>
    <li><b>לפי כמות האתנול:</b> ככל שיש יותר אתנול, המשקל הסגולי של התמיסה יורד. אפשר למדוד בהידרומטר (השיטה המקובלת בתעשיית היין).</li>
    <li><b>לפי כמות הפחמן הדו-חמצני שנפלט:</b>
      <ol type="א">
        <li>מעקב אחרי נפח הגז, למשל במזרק שמחובר למבחנת התסיסה.</li>
        <li>בדיקת החומציות: <span class="ltr">CO₂</span> מגיב עם מים ויוצר חומצה פחמתית: <span class="formula">CO₂ + H₂O → H₂CO₃</span>. את רמת החומציות בודקים בבדיקת <span class="ltr">pH</span>, או ב<b>טיטרציה</b> עם בסיס (<span class="ltr">NaOH</span>) ואינדיקטור פנולפתלאין, עד שמופיע צבע ורדרד יציב (סביבה בסיסית): <span class="formula">H₂CO₃ + NaOH → NaHCO₃ + H₂O</span></li>
      </ol>
    </li>
  </ol>

  <h2>מהלך הניסוי</h2>
  <div class="note"><b>תרשים זרימה:</b> שמרים מקובעים לשני ארלנמיירים (מים / גלוקוז 10%) ← 15 דקות ב-<span class="ltr">35°C</span> ← הוצאת שתי דגימות מכל ארלנמייר ← שטיפת השמרים במים ← תגובה חוזרת 15 דקות ב-<span class="ltr">35°C</span> ← בזמן ההמתנה: טיטרציה של הדגימות הראשונות ← הוצאת שתי דגימות מהתגובה החוזרת ← טיטרציה.</div>
  <ol>
    <li>סמנו 2 ארלנמיירים של 100 מ"ל: אחד "גלוקוז" והשני "מים".</li>
    <li>הכניסו לכל אחד 20 גרם כדורי שמרים מקובעים באלגינט.</li>
    <li>סמנו משורה אחת "גלוקוז" והשנייה "מים".</li>
    <li>הוסיפו בעזרת המשורות לכל ארלנמייר 50 מ"ל גלוקוז 10% או 50 מ"ל מים, לפי הסימון.</li>
    <li>הניחו את הארלנמיירים לאינקובציה באמבט מים ב-<span class="ltr">35°C</span> למשך 15 דקות.</li>
    <li>בזמן האינקובציה הכינו ארבעה ארלנמיירים קטנים: סמנו שניים "גלוקוז" ושניים "מים".</li>
    <li>בסוף האינקובציה הוציאו מכל ארלנמייר שבאמבט, בעזרת פיפטור או פיפטה, שתי דגימות של 10 מ"ל מהנוזל העליון (התסנין), והעבירו אותן לשני הארלנמיירים הקטנים עם אותו סימון. הוסיפו לכל אחד 3 טיפות פנולפתלאין.</li>
    <li><b>שטיפה כפולה של הכדורונים במים:</b> שימו מסננת על פי הארלנמייר "מים", ושפכו רק את הנוזל (בלי הכדורונים) לכלי הפסולת. החזירו את הכדורונים לארלנמייר, הוסיפו 50 מ"ל מים מזוקקים, ערבבו ושפכו רק את הנוזל דרך המסננת. חזרו על זה פעם נוספת. בצעו את אותה שטיפה בארלנמייר "גלוקוז".</li>
    <li>לתגובה החוזרת: הוסיפו שוב לכל ארלנמייר 50 מ"ל גלוקוז 10% או 50 מ"ל מים, עם המשורות המתאימות. <b>שימו לב להכניס את התמיסה הנכונה לכל ארלנמייר.</b></li>
    <li>החזירו את הארלנמיירים לאמבט ב-<span class="ltr">35°C</span> למשך 15 דקות.</li>
    <li>בזמן הזה טטרו לאט, טיפה אחרי טיפה, את התסנין בארבעת הארלנמיירים מהאינקובציה הראשונה, עם <span class="ltr">NaOH 0.05M</span>, עד שמתקבל צבע ורדרד חיוור יציב. רשמו בטבלה 9.1.</li>
    <li>הכינו ארבעה ארלנמיירים קטנים נוספים: שניים "גלוקוז" ושניים "מים".</li>
    <li>אחרי 15 דקות של התגובה החוזרת, הוציאו מכל ארלנמייר שתי דגימות של 10 מ"ל מהנוזל העליון, העבירו לארלנמיירים הקטנים, והוסיפו לכל אחד 3 טיפות פנולפתלאין.</li>
    <li>טטרו לאט את התסנין עם <span class="ltr">NaOH 0.05M</span> עד צבע ורדרד חיוור יציב, ורשמו בטבלה.</li>
  </ol>

  <h2>ניתוח תוצאות, דיון ומסקנות</h2>
  <h3>ניתוח התוצאות</h3>
  <ol>
    <li>חשבו את ממוצע נפח הטיטרציה בכל ארלנמייר, בשימוש הראשון ובשימוש החוזר, עם גלוקוז ועם מים, ורשמו בטבלה 9.1.</li>
    <li>הפחיתו את ממוצע נפח הטיטרציה בארלנמייר עם המים מהממוצע בארלנמייר עם הגלוקוז, בכל אחת מהחזרות, ורשמו בטבלה. ההפרש מבטא את עוצמת התסיסה של השמרים המקובעים.</li>
  </ol>
  <h3>שאלות לדיון</h3>
  <ol>
    <li>סכמו את המסקנות שלכם מתוצאות הניסוי.</li>
    <li>הסבירו ממה נובע ההבדל ברמת החומציות של התמיסה אחרי פעולת השמרים, בין הארלנמייר עם הגלוקוז לארלנמייר עם המים.</li>
    <li>מדוע לקחו מכל ארלנמייר שתי דגימות ולא אחת?</li>
    <li>מה היתרון בשימוש בשמרים מקובעים לעומת שמרים מסיסים?</li>
    <li>מדוע חוקרים בוחרים היום בתרבית תאי שמרים בתעשיית הביוטכנולוגיה, ומה ההבדל בין השימושים בתאי שמרים בביוטכנולוגיה המסורתית לבין המודרנית?</li>
    <li>בניסוי השתמשתם בתאי שמרים מקובעים, שמכילים אנזימים רבים ומבצעים תהליכים רבים, ובהם הפקת אנרגיה בנשימה. בטכניקות דומות אפשר לקבע אנזימים שהופקו מתאים, במקום תאים שלמים. מה יכולים להיות היתרונות והחסרונות של קיבוע אנזים מסוים, לעומת תא שמכיל מספר גדול של אנזימים?</li>
  </ol>

  <h3>מושגי חובה לבגרות</h3>
  <p>שמרים כאנאירובים פקולטטיביים · נשימה תאית אירובית ותסיסה · קיבוע תאים ואנזימים באלגינט · יתרונות וחסרונות של קיבוע · חומצה פחמתית · טיטרציה ואינדיקטור פנולפתלאין · ביוטכנולוגיה מסורתית ומודרנית</p>

  <h2>מטרת המעבדה</h2>
  <p>ביצוע טרנספורמציה של פלסמיד רקומביננטי לחיידקי <i class="ltr">E. coli</i> בעזרת שוק תרמי (<span class="ltr">Heat shock</span>), ובדיקת ביטוי הגנים בחיידקים בעזרת גן מדווח.</p>

  <h2>רקע עיוני</h2>
  <h3>פלסמיד</h3>
  <p>חיידקים הם אורגניזמים פרוקריוטים חד-תאיים. לחיידק יש כרומוזום מעגלי גדול אחד, שמכיל את גנום החיידק. בנוסף, חיידקים רבים מכילים <b>פלסמידים</b>: מולקולות <span class="ltr">DNA</span> מעגליות קטנות, באורך של עד כ-10,000 נוקלאוטידים. כל פלסמיד מופיע בתא כמה פעמים, בניגוד לכרומוזום שמופיע פעם אחת. לפלסמיד יש יכולת שכפול עצמאית, בלי תלות בשכפול החיידק, בזכות מקטע שנקרא <b>"מוצא ההכפלה"</b> (<span class="ltr">Origin of replication, ORI</span>).</p>
  <p>פלסמידים מכילים לרוב גנים לתכונות נוספות שאינן חיוניות לחיידק, כמו פירוק לקטוז או עמידות לאנטיביוטיקה. תכונות אלה נותנות לחיידק יתרון הישרדותי.</p>

  <h3>פלסמיד רקומביננטי</h3>
  <p>בהנדסה גנטית אפשר לייצר פלסמיד רקומביננטי, שמכיל <span class="ltr">DNA</span> ממקורות שונים. מקטע ה-<span class="ltr">DNA</span> שמכניסים לפלסמיד נקרא <b>מחדר</b>, והוא יכול להגיע מחיידק אחר או מאורגניזם אאוקריוטי. הפלסמיד קטן יחסית, ולכן גודל המחדר מוגבל.</p>
  <p>פלסמיד לשיבוט חייב לכלול לפחות אתר אחד לאנזים הגבלה (רסטריקציה), כדי שאפשר יהיה לחתוך אותו ולהכניס את המחדר. הוא צריך לכלול גם <b>גן בורר</b>, בדרך כלל גן לעמידות לאנטיביוטיקה, כדי לברור את החיידקים שקיבלו את הפלסמיד מאלה שלא קיבלו.</p>
  <p>כדי לייצר פלסמיד רקומביננטי חותכים את המחדר ואת הפלסמיד באותו אנזים הגבלה (או באנזימים שיוצרים קצוות מתאימים לחיבור). החיבור נקרא <b>ליגציה</b> ונעשה בעזרת האנזים <b>ליגאז</b>, שיוצר קשרים פוספודיאסטריים בין הנוקלאוטידים. חשוב לבחור אתרי חיתוך שלא פוגעים באזורים חשובים בפלסמיד, כמו ה-<span class="ltr">ORI</span> והגן לעמידות.</p>
  <h3>בקרה על ביטוי גנים</h3>
  <p>הבקרה על ביטוי גנים מאפשרת לתאים לבטא גנים מסוימים רק כשצריך, ומונעת ייצור מיותר של חלבונים. רוב הוויסות נעשה ברמת התעתוק מ-<span class="ltr">DNA</span> ל-<span class="ltr">RNA</span>.</p>
  <p>בתחילת כל גן יש <b>אזור בקרה (פרומוטור, מקדם)</b>, שאליו נקשר האנזים <span class="ltr">RNA</span> פולימראז כדי להתחיל את התעתוק. לעיתים הפולימראז יכול להיקשר לפרומוטור רק אחרי שחלבונים שנקראים <b>גורמי תעתוק</b> נקשרים אליו: זו <b>בקרה חיובית</b>. יש גם חלבונים <b>דכאנים</b> (רפרסורים) שנקשרים לאזור הבקרה ומונעים את התעתוק כשהגן לא נחוץ: זו <b>בקרה שלילית</b>.</p>
  <p>כשמכניסים לתא גן מאורגניזם אחר, צריך לוודא שבפלסמיד יש גם אזור בקרה שמתאים לתא המקבל, כדי שגורמי התעתוק שלו יוכלו להפעיל את הגן.</p>
  <h3>גן מדווח</h3>
  <p><b>גן מדווח</b> הוא גן שאת התוצר החלבוני שלו אפשר למדוד בקלות, למשל לפי צבע או פלואורסצנציה. בעזרתו אפשר לבדוק אם פרומוטור הופעל, או אם הפלסמיד נכנס לתא, וכך לוודא שהטרנספורמציה הצליחה.</p>
  <p>אחד הגנים המדווחים הנפוצים הוא <b>GFP</b> (<span class="ltr">Green Fluorescent Protein</span>): חלבון פלואורסצנטי שמקורו במדוזה. כשמקרינים עליו אור <span class="ltr">UV</span>, הוא פולט אור ירוק. גנים מדווחים נוספים הם הגן לאנזים בטא גלקטוזידאז, שמפרק את המצע <span class="ltr">X-gal</span> לתוצר כחול, והגן לאנזים אלקליין פוספטאז, שיוצר תוצר צהוב.</p>
  <h3>טרנספורמציה בשוק תרמי</h3>
  <p>כדי שהחיידק יבטא את הגנים שבפלסמיד, צריך להכניס אליו את הפלסמיד. לשם כך מבצעים <b>שוק תרמי</b>, שיוצר חורים קטנים בקרום החיידק:</p>
  <ul>
    <li>מכניסים את החיידקים לבופר טרנספורמציה עם המלח <span class="ltr">CaCl₂</span>, יחד עם הפלסמידים. יוני הסידן (<span class="ltr">Ca²⁺</span>) ממסכים את המטען השלילי של קרום התא, ומאפשרים לפלסמיד, שגם הוא טעון שלילית, להתקרב לקרום.</li>
    <li>מקררים ל-<span class="ltr">0°C</span>, כדי לעצור את תנועת הפוספוליפידים בקרום.</li>
    <li>מעבירים לזמן קצר מאוד ל-<span class="ltr">42°C</span>. המעבר החד יוצר חורים קטנים בקרום, ודרכם נכנסים הפלסמידים לציטופלסמה.</li>
    <li>מחזירים מיד לקרח, כי זמן ממושך בטמפרטורה גבוהה יפרק את הקרום ויהרוג את החיידק.</li>
  </ul>
  <p>הסיכוי שפלסמידים ייכנסו בדרך זו נמוך, ולכן משתמשים ב<b>חיידקים קומפטנטיים</b>: חיידקים שעברו תהליך שמגביר את חדירות הקרום לפלסמידים.</p>
  <h3>ברירה (סלקציה) אחרי הטרנספורמציה</h3>
  <p>אחרי השוק התרמי נותנים לחיידקים זמן להתאושש, לשכפל את הפלסמיד ולבטא את הגנים שבו. ההתאוששות נעשית בטמפרטורה האופטימלית (<span class="ltr">37°C</span>) ובמצע מזון עשיר (<span class="ltr">LB</span>).</p>
  <p>אחר כך זורעים את החיידקים על צלחות אגר עם מזון ואנטיביוטיקה (<b>מצע סלקטיבי</b>). רק חיידקים שקיבלו את הפלסמיד ומבטאים את הגן לעמידות יתרבו ויצרו מושבות. חיידקים שלא קיבלו את הפלסמיד ימותו. לבקרה זורעים את החיידקים גם על מצע מזון עשיר בלי אנטיביוטיקה: שם יגדלו כל החיידקים ששרדו את השוק התרמי, וכך מוודאים שהתהליך בוצע היטב.</p>
  <h3>הפלסמיד pGLO ובקרת ארבינוז</h3>
  <p>הסוכר <b>ארבינוז</b> הוא מקור אנרגיה ופחמן לתא. חיידקי <i class="ltr">E. coli</i> מייצרים שלושה אנזימים לפירוק ארבינוז, אבל הגנים שלהם מתבטאים רק כשיש ארבינוז בסביבה. הפרומוטור של הגנים האלה נקרא <span class="ltr">PBAD</span>. ה-<span class="ltr">RNA</span> פולימראז יכול להיקשר אליו רק כשגורם התעתוק <b><span class="ltr">araC</span></b> פעיל.</p>
  <p>גורם התעתוק <span class="ltr">araC</span> קשור ל-<span class="ltr">DNA</span> באזור הפרומוטור כל הזמן, אבל בלי ארבינוז הוא לא פעיל. כשארבינוז נכנס לתא, הוא נקשר ל-<span class="ltr">araC</span>, משנה את צורתו, ומאפשר ל-<span class="ltr">RNA</span> פולימראז להיקשר ולהתחיל לתעתק. כשהארבינוז מתפרק ונגמר, <span class="ltr">araC</span> חוזר לצורתו המקורית והתעתוק נפסק.</p>
  <p>בניסוי משתמשים בפלסמיד הרקומביננטי <b>pGLO</b>, שמכיל:</p>
  <ul>
    <li><b><span class="ltr">ori</span>:</b> מוצא ההכפלה של הפלסמיד.</li>
    <li><b><span class="ltr">bla</span>:</b> גן לעמידות לאנטיביוטיקה אמפיצילין.</li>
    <li><b><span class="ltr">araC</span>:</b> גן לגורם התעתוק <span class="ltr">araC</span>, שפעיל רק בנוכחות ארבינוז.</li>
    <li><b>GFP:</b> הגן המדווח לחלבון הפלואורסצנטי הירוק, מחובר לאזור הבקרה <span class="ltr">PBAD</span>.</li>
  </ul>
  <p>בנוכחות ארבינוז, <span class="ltr">araC</span> פעיל והגן GFP מתועתק ומתורגם, והמושבות זוהרות בירוק תחת <span class="ltr">UV</span>. בלי ארבינוז, ה-<span class="ltr">RNA</span> פולימראז לא נקשר לפרומוטור, אין תעתוק של GFP, והמושבות לבנות.</p>

    <li>מכניסים 500 מ"ל מים מזוקקים לארלנמייר של 1 ליטר, ומוסיפים את תכולת שקית האגר (<span class="ltr">LB nutrient agar</span>). מערבבים בבוחש מגנטי תוך חימום, עד להמסה מלאה. <b>יש להיזהר לא לחמם את האגר עד ייבוש.</b></li>
    <li>מרתיחים 5 דקות תוך ערבוב, ליצירת תמיסה סטרילית, או מכניסים לאוטוקלב.</li>
    <li>מקררים לטמפרטורה של <span class="ltr">50°C</span>. לא לקרר יותר, כדי שהאגר לא יתקרש בארלנמייר.</li>
    <li>בזמן הקירור מכינים את הצלחות (הוראות לערכה של 8 קבוצות):
      <ul>
        <li>מסמנים 16 צלחות פטרי <b>LB</b> בתחתית הצלחת (לא על המכסה!), בצדדים ולא במרכז, כדי שאפשר יהיה לראות היטב את התוצאות.</li>
        <li>באותו אופן מסמנים 16 צלחות <b>LB/AMP</b> ו-8 צלחות <b>LB/AMP/ara</b>.</li>
      </ul>
    </li>
    <li><b>המסת ארבינוז:</b> הארבינוז מגיע כאבקה במיכל קטן. בפיפטור סטרילי מעבירים 3 מ"ל מתמיסת הטרנספורמציה (<span class="ltr">transformation solution</span>) למיכל הארבינוז, ומערבבים עד להמסה מלאה. הארבינוז מתמוסס לאט יחסית, וזה יכול לקחת כמה דקות.</li>
    <li><b>המסת אמפיצילין:</b> גם האמפיצילין מגיע כאבקה במיכל קטן. בפיפטור סטרילי חדש מעבירים 3 מ"ל מתמיסת הטרנספורמציה למיכל האמפיצילין, ומערבבים עד להמסה מלאה.</li>
    <li><b>מזיגת צלחות LB:</b> ל-16 צלחות <b>LB</b> שופכים מתמיסת האגר עד שליש הגובה (או מחצית), ומכסים.</li>
    <li><b>צלחות LB/AMP:</b> רק אחרי שהוכנו צלחות ה-LB, מוסיפים את תמיסת האמפיצילין לארלנמייר עם האגר, מערבבים, ושופכים ל-16 צלחות <b>LB/AMP</b> עד שליש הגובה. מכסים.</li>
    <li><b>צלחות LB/AMP/ara:</b> רק אחרי שהוכנו צלחות ה-LB וה-LB/AMP, מוסיפים את תמיסת הארבינוז לארלנמייר עם האגר והאמפיצילין, מערבבים, ושופכים ל-8 צלחות <b>LB/AMP/ara</b> עד שליש הגובה. מכסים.</li>
    <li>משאירים את הצלחות 30 דקות להתייצבות בטמפרטורת החדר. אחר כך אפשר לאחסן אותן במקרר, או להשאיר בטמפרטורת החדר ליומיים. במקרר מאחסנים כך ששכבת האגר פונה כלפי מעלה.</li>
  </ol>
  <h3>זריעת חיידקים (יום-יומיים לפני המעבדה)</h3>
  <ol>
    <li>בפיפטור סטרילי מוסיפים <span class="ltr">250 µl</span> מתמיסת <span class="ltr">LB</span> (<span class="ltr">LB nutrient broth</span>) למיכל החיידקים <i class="ltr">E. coli HB101</i>. מערבבים בעדינות עד להמסת החיידקים.</li>
    <li>מכניסים את תמיסת החיידקים לאינקובטור ב-<span class="ltr">37°C</span> ל-8 עד 24 שעות. <b>את תמיסת ה-LB שנשארה שומרים במקרר: התלמידים זקוקים לה במהלך הניסוי.</b></li>
    <li>אחרי האינקובציה מערבבים בעדינות את תמיסת החיידקים.</li>
    <li>ל-8 צלחות פטרי מסומנות <span class="ltr">LB</span> מבצעים <b>זריעת בידוד</b>: מכניסים את הלולאה שבמקל זריעה חדש לתמיסת החיידקים (ומוודאים שיש תמיסה על הלולאה), מורחים בעדינות על רבע מהצלחת בצורת פסים, מסובבים את הצלחת ב-90 מעלות, וממשיכים מהאזור הראשון לרבע הבא, וכך עד שכל הצלחת זרועה.</li>
    <li>סוגרים את הצלחות מהר ככל האפשר, למניעת זיהומים, ומכניסים לאינקובטור ב-<span class="ltr">37°C</span> ללילה. <b>שלב זה חייב להיעשות בלילה שלפני הניסוי.</b></li>
  </ol>
  <div class="warn">המושבות של <i class="ltr">E. coli</i> לבנות, עם שוליים חלקים. אם רואים בצלחת מושבה אחרת, זה זיהום: אין לתת לתלמידים להשתמש בצלחת, ויש להשמיד אותה באוטוקלב.</div>
  <h3>הכנת תמיסות העבודה (יום לפני הניסוי או ביום הניסוי)</h3>
  <p>בפיפטור עם טיפ סטרילי מוסיפים <span class="ltr">250 µl</span> תמיסת טרנספורמציה לבקבוקון הפלסמיד (<span class="ltr">DNA pGLO lyophilized</span>). שימו לב: כמות ה-<span class="ltr">DNA</span> קטנה מאוד, והבקבוקון יכול להיראות ריק. חשוב לוודא שה-<span class="ltr">DNA</span> מומס בתמיסה ולא נצמד למכסה. אפשר להיעזר בצנטריפוגת <span class="ltr">spin down</span>: מערבבים היטב ומסרכזים 10 שניות (מכניסים מבחנה נוספת מול מבחנת הפלסמיד, כדי לאזן את הצנטריפוגה). מאחסנים את ה-<span class="ltr">DNA</span> במקרר עד תחילת הניסוי.</p>
  <h3>הכנת מגשי העבודה</h3>
  <p>לכל קבוצה מכינים מבחנת אפנדורף עם 1 מ"ל תמיסת טרנספורמציה (<span class="ltr">CaCl₂</span>), ומבחנה נוספת עם 1 מ"ל תמיסת <span class="ltr">LB</span>. מסמנים כל מבחנה בהתאם. מכינים את המגשים לפי רשימת הציוד לכל קבוצה.</p>
  <div class="warn"><b>בסיום העבודה יש להכניס את כל החומר הביולוגי, כולל הפחים הביולוגיים של הקבוצות, לאוטוקלב לעיקור. אחרי קריאת התוצאות בצלחות יש להשמיד את החיידקים באוטוקלב.</b></div>

  <h2>מטרת המעבדה</h2>
  <p>עריכה גנטית של גן ספציפי בחיידקים, על ידי חיתוך הגן בעזרת האנזים <span class="ltr">CAS-9</span> שמחובר למולקולת <span class="ltr">RNA</span> מדריך מתאימה, והפעלת מערכת התיקון בתא על ידי בקרת ביטוי גנים.</p>

  <h2>רקע עיוני</h2>
  <p>מערכת <b>קריספר (CRISPR)</b> היא מערכת של רצפי <span class="ltr">DNA</span>, <span class="ltr">RNA</span> וחלבונים, שנמצאת במגוון רחב של חיידקים ומשמשת אותם כמערכת הגנה מפני וירוסים (בקטריופאג'ים). חוקרים רבים מנצלים היום את הפוטנציאל של המערכת להנדסה גנטית של אורגניזמים שונים, ברפואה, בחקלאות, במחקר ועוד. האנזים <b><span class="ltr">CAS-9</span></b> של החיידק <i class="ltr">Streptococcus pyogenes</i> הוא אחד האנזימים העיקריים שבהם מבצעים היום עריכה גנטית.</p>
  <p>האנזים <span class="ltr">CAS-9</span> חותך רצף <span class="ltr">DNA</span> ספציפי, לפי הרצף של מולקולת <b><span class="ltr">RNA</span> מדריך</b> (<span class="ltr">Guide RNA, gRNA</span>) שמשתלבת במבנה התלת-ממדי של האנזים. האנזים חותך מולקולת <span class="ltr">DNA</span> דו-גדילית ברצף שמשלים לרצף ה-<span class="ltr">RNA</span> המדריך, ומנתק את הקשר הפוספודיאסטרי בין שני נוקלאוטידים בכל גדיל.</p>
  <p>ה-<span class="ltr">RNA</span> המדריך מורכב משני חלקים:</p>
  <ol>
    <li><b>חלק ספציפי לגן המטרה:</b> רצף של כ-20 נוקלאוטידים, שמתאים באופן משלים לרצף המטרה ב-<span class="ltr">DNA</span>. ההתאמה מאפשרת זיהוי מדויק של המיקום שבו <span class="ltr">CAS-9</span> יחתוך.</li>
    <li><b>חלק מבני:</b> מבנה קבוע שמייצב את הקישור בין ה-<span class="ltr">RNA</span> המדריך לאנזים <span class="ltr">CAS-9</span>, ומבטיח פעילות נכונה של המערכת.</li>
  </ol>
  <p>בשיטה זו אפשר להכין רצף <span class="ltr">RNA</span> מדריך מותאם אישית, ולחתוך כל מקטע <span class="ltr">DNA</span> באופן ספציפי וביעילות גבוהה.</p>
  <h3>מערכת התיקון הגנומית</h3>
  <p>אחרי החיתוך על ידי <span class="ltr">CAS-9</span>, מופעלת בתא <b>מערכת התיקון הגנומית</b> הטבעית, שמטרתה לאחות את ה-<span class="ltr">DNA</span> שנחתך. המערכת כוללת חלבונים ואנזימים שמתבטאים באופן טבעי בתאים ומתקנים שברים ב-<span class="ltr">DNA</span>. היא יכולה להכניס באופן אקראי נוקלאוטידים כדי לחבר את שני המקטעים שנחתכו, וכתוצאה מכך נוצרת מוטציה באתר החיתוך. אם מכניסים לתא, בנוסף ל-<span class="ltr">CAS-9</span> ול-<span class="ltr">RNA</span> המדריך, גם רצף <span class="ltr">DNA</span> חדש (<b><span class="ltr">Donor DNA</span></b>), מערכת התיקון תשלב אותו במקום החיתוך כדי לאחות בין המקטעים. בחיידקים, שהגנום שלהם בנוי מכרומוזום בודד, אם התיקון לא מתבצע (כשמערכת התיקון לא מופעלת), החיידק ימות.</p>
  <h3>היתרונות של CRISPR-CAS-9</h3>
  <p>בניגוד לאנזימי הגבלה (רסטריקציה), שמזהים וחותכים רצפי <span class="ltr">DNA</span> ספציפיים וקצרים (4–8 נוקלאוטידים) שקיימים באופן טבעי בגנום, <span class="ltr">CAS-9</span> מאפשר חיתוך מדויק ומותאם אישית בכל רצף <span class="ltr">DNA</span> נבחר, בעזרת <span class="ltr">RNA</span> מדריך שקל לתכנן לכל רצף מטרה. יתרון חשוב נוסף הוא היכולת לבצע עריכה גנטית <b>בתאים חיים</b>, כמו החיידקים בניסוי. המערכת פועלת בתאים חיים עם מערכת תיקון טבעית, ולכן אפשר לבצע מגוון שינויים: הוספת רצף <span class="ltr">DNA</span>, ביטול ביטוי גן, או שינוי של רצפים גנטיים. הפשטות, היעילות והדיוק הופכים את CRISPR לכלי רב-עוצמה למחקר, לרפואה ולתעשייה.</p>

  <h3>עריכה גנטית של הגן המדווח lacZ בחיידקי <i class="ltr">E. coli</i></h3>
  <p>בניסוי בודקים את פעולת <span class="ltr">CAS-9</span> בנוכחות <span class="ltr">RNA</span> מדריך שמשלים לגן <b><span class="ltr">lacZ</span></b>, בחיידקים שבהם הופעלה מערכת התיקון הגנומית, לפי גדילת המושבות וצבען. כבקרה בודקים את פעולת <span class="ltr">CAS-9</span> בלי <span class="ltr">RNA</span> מדריך ובלי הפעלת מערכת התיקון.</p>
  <p>הגן <span class="ltr">lacZ</span> מקודד לאנזים <b>בטא-גלקטוזידאז</b> (<span class="ltr">β-gal</span>), ונמצא בגנום של <i class="ltr">E. coli</i>. תפקידו לפרק את הסוכר לקטוז כשהוא נמצא בסביבת החיידק. כשמוסיפים למצע הגידול את החומר <b><span class="ltr">X-gal</span></b>, האנזים מפרק אותו ומתקבל תוצר כחול, ולכן המושבות נצבעות בכחול. בלי האנזים, או במצע בלי <span class="ltr">X-gal</span>, המושבות לבנות. לכן הגן לבטא-גלקטוזידאז משמש כגן מדווח: את ביטויו אפשר לראות בקלות לפי צבע המושבות.</p>
  <p>בניסוי מבוצעת עריכה גנטית של <span class="ltr">lacZ</span>: הגן נחתך על ידי <span class="ltr">CAS-9</span>, ובעקבות זאת ביטוי הגן התקין מבוטל על ידי מערכת התיקון. חיידקים אחרי העריכה לא יוצרים מושבות כחולות על מצע עם <span class="ltr">X-gal</span>, כי ביטוי בטא-גלקטוזידאז אינו תקין.</p>
  <h3>חיתוך lacZ על ידי CAS-9</h3>
  <p>בחיידקי הניסוי האנזים <span class="ltr">CAS-9</span> מבוטא. הוא נקשר ל-<span class="ltr">DNA</span> המטרה בעזרת <span class="ltr">RNA</span> מדריך עם רצף שמשלים ל-<span class="ltr">DNA</span> הרצוי, וחותך שם את ה-<span class="ltr">DNA</span>. בניסוי זה רצף המטרה הוא <span class="ltr">lacZ</span>, ולכן מבצעים טרנספורמציה עם פלסמיד שמקודד ל-<span class="ltr">RNA</span> מדריך משלים לגן זה. מערכת התיקון פועלת לחבר את הרצפים שנחתכו. מאחר ש-<span class="ltr">lacZ</span> נמצא בכרומוזום החיידק, התיקון הכרחי להמשך חיי החיידק.</p>
  <h3>הפעלת מערכת התיקון בבקרת ארבינוז</h3>
  <p>החיידקים בניסוי הונדסו כך שמערכת התיקון הגנומית לא פועלת בהם באופן קבוע, אלא נמצאת תחת בקרת גנים של הסוכר <b>ארבינוז</b>. בנוכחות ארבינוז במצע הגידול, מערכת התיקון פועלת והרצפים שנחתכו מחוברים. בלי ארבינוז לא מתבצע תיקון, והחיידקים מתים.</p>
  <p>בנוכחות ארבינוז, תיקון הרצף החתוך מבוצע בעזרת רצף <span class="ltr">Donor DNA</span> באמצע <span class="ltr">lacZ</span>. הרצף תוכנן כך שיכלול <b>קודון סיום (stop codon)</b>, שגורם להפסקה מוקדמת של תרגום ה-<span class="ltr">mRNA</span> של הגן. לכן ביטוי <span class="ltr">lacZ</span> ייפגע, ולא יימצא בתאים אנזים בטא-גלקטוזידאז תקין. ה-<span class="ltr">Donor DNA</span> והרצף ל-<span class="ltr">RNA</span> המדריך יוכנסו לחיידקים בטרנספורמציה עם פלסמיד מתאים.</p>
  <h3>מבנה ומרכיבי הניסוי</h3>
  <p>כדי לבצע בקרות מתאימות על פעולת <span class="ltr">CAS-9</span> ומערכת התיקון, הטרנספורמציה תבוצע לחיידקים שגודלו על שני סוגי מצעים (עם ובלי ארבינוז), ועם שני סוגי פלסמידים:</p>
  <ol type="א">
    <li><b><span class="ltr">pLZDonorGuide (pDG)</span>:</b> מכיל את רצף ה-<span class="ltr">Donor DNA</span> לתיקון הגנום החתוך, וגם את הרצף שמקודד ל-<span class="ltr">RNA</span> מדריך.</li>
    <li><b><span class="ltr">pLZDonor (pD)</span>:</b> מכיל את רצף ה-<span class="ltr">Donor DNA</span>, אבל <b>לא</b> את הרצף שמקודד ל-<span class="ltr">RNA</span> מדריך.</li>
  </ol>
  <p>החיידקים, שבהם הופעלה או לא הופעלה מערכת התיקון, ייזרעו אחרי הטרנספורמציה עם שני סוגי הפלסמידים, על צלחות עם מצע גידול ו-<span class="ltr">X-gal</span>.</p>
  <h3>תוצאות הניסוי הצפויות</h3>
  <ol type="א">
    <li>חיידקים שבהם <span class="ltr">CAS-9</span> פעל בנוכחות <span class="ltr">RNA</span> מדריך של <span class="ltr">lacZ</span>, וגדלו על מצע <b>בלי</b> ארבינוז, ימותו, ולכן לא יופיעו מושבות בצלחת.</li>
    <li>חיידקים שבהם <span class="ltr">CAS-9</span> פעל בנוכחות <span class="ltr">RNA</span> מדריך של <span class="ltr">lacZ</span>, וגדלו על מצע <b>עם</b> ארבינוז, ייצרו מושבות שלא מבטאות בטא-גלקטוזידאז, ולכן המושבות יהיו <b>לבנות</b>.</li>

  <h2>מהלך הניסוי (לפי ערכת Bio-Rad, מק"ט <span class="ltr">#12012608EDU</span>)</h2>

  <h3>תרגול מקדים</h3>
  <p>במעבדה תוסיפו נוזל עם פלסמידים בנפח קטן לתוך נוזל עם חיידקים. ביצוע נכון של הפעולה חיוני להצלחת הניסוי, ולכן מומלץ לתרגל אותה קודם (התרגול לא מסופק בערכה).</p>
  <ol>
    <li>לפניכם 2 מבחנות אפנדורף: אחת עם מים וצבע מאכל, והשנייה עם <span class="ltr">250 µl</span> מים.</li>
    <li>הוציאו בפיפטור <span class="ltr">10 µl</span> צבע מאכל, ובדקו שהנוזל אכן עלה לטיפ. הכניסו את הצבע למבחנה השנייה, על ידי הכנסת הטיפ לתוך הנוזל ושחרור הצבע.</li>
    <li>ערבבו את הצבע במבחנה בטפיחות קלות על תחתית המבחנה. ודאו שטיפת הצבע נכנסה לתוך המים.</li>

    <li>העבירו בפיפטור עם טיפ סטרילי <span class="ltr">250 µl</span> תמיסת טרנספורמציה (<span class="ltr">CaCl₂</span>) לכל מבחנה.</li>
    <li>זרקו את הטיפ לפח הביולוגי וסגרו את המבחנות.</li>
    <li>הכניסו את המבחנות לסל הקרח.</li>
    <li>פתחו את שקית מקלות הדגימה הסטריליים מצד הידית. פתחו פתח קטן ככל האפשר, וקחו מקל אחד בכל פעם. <b>אל תגעו בטבעת, רק בידית האחיזה!</b></li>
    <li>בטבעת של מקל דגימה, אספו <b>5 מושבות</b> חיידקים מצלחת הפטרי המסומנת <b><span class="ltr">KIX</span></b>, והכניסו אותן למבחנה <b>A</b> על ידי סיבוב המקל עד שכל החיידקים יורדים מהלולאה.</li>

    <li>חזרו על שלבים 9–10 עם מבחנה <b>B</b>: 5 מושבות מצלחת <span class="ltr">KIX</span>, במקל דגימה חדש. <b>הקפידו לסגור את צלחת החיידקים בסוף.</b></li>

    <li>זרקו את המקל לפח הביולוגי. סגרו את המבחנה והחזירו לסל הקרח.</li>
    <li>חזרו על שלבים 9–10 עם מבחנה <b>D</b>: 5 מושבות מצלחת <span class="ltr">KIX/ARA</span>, במקל דגימה חדש. <b>הקפידו לסגור את צלחת החיידקים בסוף.</b></li>

    <li>העבירו בפיפטור עם טיפ סטרילי <span class="ltr">10 µl</span> פלסמיד <b><span class="ltr">pLZDonorGuide (pDG)</span></b> לתוך הנוזל במבחנה <b>B</b>. זרקו את הטיפ לפח הביולוגי.</li>

    <li>חזרו על שלבים 16–17 עם מבחנה <b>D</b>: <span class="ltr">10 µl</span> פלסמיד <span class="ltr">pLZDonorGuide (pDG)</span>.</li>
    <li>בצעו בעזרת המורה סרכוז קצר של כ-3 שניות לארבע מבחנות הניסוי (A–D), עם איזון הצנטריפוגה. השאירו את המבחנות עם החיידקים והפלסמידים לפחות <b>10 דקות בקרח</b>.</li>
    <li>קרבו את סל הקרח לאמבט שמכוון ל-<b><span class="ltr">60°C</span></b>, והכניסו את מבחנות A–D למצוף. ודאו שהן ממוקמות כך שהנוזל שבהן יהיה בתוך מי האמבט.</li>

    <li>הוציאו את המבחנות מסל הקרח.</li>
    <li>הוסיפו בפיפטור עם טיפ סטרילי <span class="ltr">250 µl</span> מצע <span class="ltr">LB</span> לכל מבחנה. <b>החליפו טיפ בכל מבחנה.</b> זרקו את הטיפים לפח הביולוגי.</li>
    <li>סגרו את המבחנות וערבבו בעדינות ב-3 טפיחות על תחתית המבחנות.</li>
    <li>הכניסו את המבחנות שוב למצוף, ואת המצוף לאמבט ב-<span class="ltr">37°C</span>, למשך כ-30 דקות.</li>

  <ol start="30">
    <li>בזמן ההמתנה סמנו את 4 צלחות הזריעה באותיות A–D, ובשם הקבוצה ותאריך הניסוי, על הצלחת עצמה (לא על המכסה), בכתב קטן בשוליים.</li>

  <h2>ניתוח תוצאות, דיון ומסקנות</h2>
  <h3>הסבר לתוצאות הניסוי</h3>
  <ol>
    <li>סכמו את גדילת המושבות בכל אחת מצלחות הניסוי, והסבירו את התוצאות בכל טיפול. הסבירו את הגדילה ואת הצבע, בהתייחס לסוג הפלסמיד שחדר לחיידקים ולהפעלת מערכת התיקון. התייחסו לשאלה אם התוצאות תואמות את התוצאות הצפויות מהרקע העיוני. אם יש תוצאות שלא תואמות, נסו להסביר אותן.</li>
    <li>הסבירו מה מטרת טיפול הבקרה עם הפלסמיד <span class="ltr">pLZDonor (pD)</span>.</li>
  </ol>
  <h3>שאלות לדיון</h3>
  <ol>
    <li>הסבירו כיצד אפשר לזהות בניסוי את פעילות <span class="ltr">CAS-9</span> לחיתוך הגן המדווח. האם אפשר לזהות בדרך זו פעילות של האנזים לחיתוך מקטעים אחרים בגנום החיידק, שאינם הגן המדווח?</li>
    <li>מדוע חשוב לבחור רצף <span class="ltr">RNA</span> מדריך שמשלים בצורה מדויקת לגן המסוים שרוצים לחתוך בעזרת <span class="ltr">CAS-9</span>?</li>
    <li>באיזו שיטה מבין שתי שיטות התיקון של מערכת התיקון הגנומית השתמשו בניסוי? חשבו מדוע נבחרה שיטה זו.</li>
    <li>כשמערכת התיקון לא פעלה בזמן חיתוך הגן על ידי <span class="ltr">CAS-9</span>, החיידקים מתו. הסבירו מדוע, ומה היה קורה אילו גן המטרה לחיתוך היה ממוקם בפלסמיד ולא בגנום החיידק.</li>
    <li>השימוש ב-CRISPR וב-<span class="ltr">CAS-9</span> מאפשר עריכה גנטית בתאים חיים. לעומת זאת, עריכה גנטית בעזרת אנזימי הגבלה (רסטריקציה) לא יכולה להתבצע בתא חי. מהן התכונות של מערכת CRISPR שמאפשרות יישום ייחודי זה?</li>
  </ol>

  <p><b>מטרת טיפול הבקרה עם הפלסמיד <span class="ltr">pD</span>:</b> הבקרה מאפשרת לבדוק את מהימנות התוצאות, ולוודא שהפסקת הביטוי התקין של בטא גלקטוזידאז נובעת מנוכחות כל רכיבי מערכת קריספר. בלי <span class="ltr">RNA</span> מדריך אין פעילות של <span class="ltr">CAS-9</span> ואין חיתוך של ה-<span class="ltr">DNA</span>. כלומר, חיתוך הגן נובע מנוכחות <span class="ltr">CAS-9</span> יחד עם <span class="ltr">RNA</span> מדריך, ולא מעצם ביצוע הטרנספורמציה והכנסת מקטע ה-<span class="ltr">DNA</span> המיועד לתיקון.</p>

  <h2>מחוון לשאלות הדיון והמסקנות</h2>
  <ol>
    <li>הגן <span class="ltr">lacZ</span> הוא גן מדווח שמקודד לאנזים בטא-גלקטוזידאז, ואת ביטויו קל לראות בנוכחות המצע <span class="ltr">X-gal</span>. לכן, אם <span class="ltr">CAS-9</span> חתך את הגן וביטויו נפסק, צבע המושבות ישתנה ונוכל לראות זאת בקלות. מסיבה זו לא נוכל לזהות לפי צבע המושבות חיתוך של מקטעים אחרים בגנום שאינם גנים מדווחים. כדי לזהות חיתוך של גנים אחרים יש למצוא דרכים מתאימות לכל גן, כדי לבדוק אם אכן התרחש חיתוך בגן (אם הוכנס <span class="ltr">RNA</span> מדריך מתאים לחיתוך גן זה).</li>
    <li><span class="ltr">CAS-9</span> חותך מקטע <span class="ltr">DNA</span> בהתאם למקטע ה-<span class="ltr">RNA</span> המדריך שמשולב בו. מקטע שלא מותאם במדויק יכול לחתוך גן אחר בגנום, או להוריד את רמת הפעילות של המערכת. לכן, לחיתוך ספציפי ויעיל יש להתאים בצורה מדויקת בין הרצף המיועד לחיתוך לבין רצף ה-<span class="ltr">RNA</span> המדריך.</li>
    <li>בניסוי בוצע תיקון של מקום החיתוך על ידי הכנסת רצף <span class="ltr">DNA</span> וחיבור המקטעים. הכנסת רצף עם קודון סיום מבטיחה את הפסקת ביטוי הגן הרצוי. דרך התיקון השנייה, שכוללת חיבור נוקלאוטידים באופן אקראי, לא מבטיחה באותה רמת ודאות את ביטול ביטוי הגן ואת יצירת המוטציה הרצויה.</li>
    <li><span class="ltr">CAS-9</span> חתך את הגן <span class="ltr">lacZ</span> שנמצא בגנום החיידק, שהוא כרומוזום מעגלי יחיד. בלי תיקון הגנום, תאי החיידקים לא יכולים להמשיך לתפקד ולכן מתים. לעומת זאת, חיתוך גן בפלסמיד, שהוא <span class="ltr">DNA</span> חוץ-כרומוזומלי, לא יפריע ברוב המקרים לתפקוד החיידקים, והם יוכלו להמשיך לחיות.</li>
    <li>מערכת <span class="ltr">CRISPR-CAS-9</span> מאפשרת עריכה גנטית בתאים חיים בזכות כמה תכונות ייחודיות:
      <ul>
        <li><b>יכולת תכנון מדויקת:</b> ה-<span class="ltr">RNA</span> המדריך מזהה רצפים ספציפיים בגנום, ומאפשר כיוון מדויק של <span class="ltr">CAS-9</span> למיקום הרצוי.</li>
        <li><b>חיתוך יעיל בתנאים תאיים:</b> <span class="ltr">CAS-9</span> פעיל בתנאי התא החי ולא דורש סביבת מעבדה ייחודית, בניגוד לאנזימי הגבלה, שפעולתם מוגבלת לסביבה מלאכותית מחוץ לתאים.</li>
        <li><b>גמישות ברצפי המטרה:</b> בניגוד לאנזימי הגבלה, שמוגבלים לרצפים פלינדרומיים קצרים, <span class="ltr">CAS-9</span> יכול להיות מכוון כמעט לכל רצף <span class="ltr">DNA</span> (בתנאי שקיים רצף <span class="ltr">PAM</span> מתאים).</li>
        <li><b>מערכת הובלה לתא החי:</b> אפשר להחדיר את מרכיבי CRISPR (<span class="ltr">RNA</span> מדריך, <span class="ltr">CAS-9</span> ו-<span class="ltr">Donor DNA</span> לפי הצורך) בקלות יחסית לתאים חיים, בעזרת פלסמידים, וירוסים או ליפוזומים, וכך לעבוד ישירות על ה-<span class="ltr">DNA</span> התאי.</li>
      </ul>
    </li>
  </ol>
  <div class="note"><b>הערה:</b> רצף <span class="ltr">PAM</span> אינו חובה בתוכנית הלימודים.</div>

    <li>אם קשה להבחין בצבע המושבות, משאירים את הצלחות במקרר 1–5 ימים.</li>

/* ================= helpers ================= */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// keep chemical formulas readable inside Hebrew text
const fmt = s => esc(s).replace(/(KMnO₄|E\. coli|GFP|CRISPR|BANI|pH)/g, '<span class="ltr">$1</span>');

let areaFilter = 'הכול';

/* ================= routing ================= */
function parseHash() {
  const m = location.hash.match(/^#lab-(\d)(?:\/(student|teacher|tech))?$/);
  if (m) return { lab: +m[1], role: m[2] || 'student' };
  return { lab: 0 };
}
function go(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);

function renderNav(current) {
  const nav = $('#labNav');
  const items = [{ id: 0, label: 'דף הבית' }].concat(LABS.map(l => ({ id: l.id, label: 'מעבדה ' + l.id })));
  nav.innerHTML = items.map(it =>
    `<button role="tab" aria-selected="${it.id === current}" data-lab="${it.id}" title="${it.id ? esc(LABS[it.id - 1].short) : ''}">${it.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => go(b.dataset.lab === '0' ? '#home' : '#lab-' + b.dataset.lab)));
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function render() {
  const r = parseHash();
  renderNav(r.lab);
  if (!r.lab) renderHome(); else renderLab(r.lab, r.role);
}

/* ================= home ================= */

  const app = $('#app');
  const list = LABS.filter(l => areaFilter === 'הכול' || l.area === areaFilter);

      <p>בחרו מעבדה. לכל מעבדה יש שלושה טאבים: הוראות לתלמיד (עם סימולציה של מהלך העבודה), הנחיות למורה והנחיות ללבורנט.</p>
    </section>

    </div>

      ${list.map(l => `
